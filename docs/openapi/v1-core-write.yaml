openapi: 3.1.0
info:
  title: 3FC Core Write API
  version: 0.1.0
  description: |
    Authenticated core write routes for league/season/session/game creation and M2 roster setup.
servers:
  - url: https://qa-api.3fc.football
    description: QA
  - url: https://api.3fc.football
    description: Production
paths:
  /v1/leagues:
    post:
      summary: Create league
      operationId: createLeague
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLeagueRequest"
      responses:
        "201":
          description: League created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/League"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
  /v1/leagues/{leagueId}/seasons:
    post:
      summary: Create season
      operationId: createSeason
      parameters:
        - name: leagueId
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSeasonRequest"
      responses:
        "201":
          description: Season created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Season"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
  /v1/seasons/{seasonId}/sessions:
    post:
      summary: Create session
      operationId: createSession
      parameters:
        - name: seasonId
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
      responses:
        "201":
          description: Session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
  /v1/sessions/{sessionId}/games:
    post:
      summary: Create game
      operationId: createGame
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGameRequest"
      responses:
        "201":
          description: Game created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
  /v1/seasons/{seasonId}/teams:
    get:
      summary: List season default teams
      operationId: listSeasonTeams
      parameters:
        - name: seasonId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Season teams
          content:
            application/json:
              schema:
                type: object
                required:
                  - teams
                properties:
                  teams:
                    type: array
                    items:
                      $ref: "#/components/schemas/SeasonTeam"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/seasons/{seasonId}/teams/{teamId}:
    put:
      summary: Upsert season default team
      operationId: upsertSeasonTeam
      parameters:
        - name: seasonId
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/TeamId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertTeamRequest"
      responses:
        "200":
          description: Season team upserted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeasonTeam"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/games/{gameId}/teams:
    get:
      summary: List game teams
      operationId: listGameTeams
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Game teams
          content:
            application/json:
              schema:
                type: object
                required:
                  - teams
                properties:
                  teams:
                    type: array
                    items:
                      $ref: "#/components/schemas/GameTeam"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/games/{gameId}/teams/{teamId}:
    put:
      summary: Upsert game team override
      operationId: upsertGameTeam
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/TeamId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertTeamRequest"
      responses:
        "200":
          description: Game team upserted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameTeam"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/games/{gameId}/players:
    get:
      summary: List recent/searchable players for a game roster
      operationId: listGamePlayers
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: string
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Player list
          content:
            application/json:
              schema:
                type: object
                required:
                  - players
                properties:
                  players:
                    type: array
                    items:
                      $ref: "#/components/schemas/Player"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      summary: Quick-create a nickname player in game setup
      operationId: quickCreateGamePlayer
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuickCreateGamePlayerRequest"
      responses:
        "201":
          description: Player created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
  /v1/games/{gameId}/roster:
    get:
      summary: Read game roster
      operationId: listGameRoster
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Game roster with teams and player nicknames
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameRosterResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/games/{gameId}/roster/{playerId}:
    put:
      summary: Assign or reassign a player to a game team
      operationId: assignRosterPlayer
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: string
        - name: playerId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignRosterPlayerRequest"
      responses:
        "200":
          description: Roster assignment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RosterAssignment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 128
      description: Optional idempotency key for replay-safe writes.
    TeamId:
      name: teamId
      in: path
      required: true
      schema:
        type: string
        enum:
          - red
          - blue
          - yellow
  responses:
    BadRequest:
      description: Request body or headers failed validation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Missing or invalid session
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Caller does not have required ACL permissions
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Referenced parent entity not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    IdempotencyConflict:
      description: Idempotency key was reused with a different request payload
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    CreateLeagueRequest:
      type: object
      additionalProperties: false
      required:
        - leagueId
        - name
      properties:
        leagueId:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        slug:
          type:
            - string
            - "null"
    CreateSeasonRequest:
      type: object
      additionalProperties: false
      required:
        - seasonId
        - name
      properties:
        seasonId:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        slug:
          type:
            - string
            - "null"
        startsOn:
          type:
            - string
            - "null"
        endsOn:
          type:
            - string
            - "null"
    CreateSessionRequest:
      type: object
      additionalProperties: false
      required:
        - sessionId
        - sessionDate
      properties:
        sessionId:
          type: string
          minLength: 1
        sessionDate:
          type: string
          minLength: 1
    CreateGameRequest:
      type: object
      additionalProperties: false
      required:
        - gameId
        - gameStartTs
      properties:
        gameId:
          type: string
          minLength: 1
        gameStartTs:
          type: string
          minLength: 1
        status:
          type: string
          enum:
            - scheduled
            - live
            - finished
    UpsertTeamRequest:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
        color:
          type:
            - string
            - "null"
    QuickCreateGamePlayerRequest:
      type: object
      additionalProperties: false
      required:
        - nickname
      properties:
        playerId:
          type: string
          minLength: 1
        nickname:
          type: string
          minLength: 1
    AssignRosterPlayerRequest:
      type: object
      additionalProperties: false
      required:
        - teamId
      properties:
        teamId:
          type: string
          enum:
            - red
            - blue
            - yellow
    League:
      type: object
      required:
        - leagueId
        - name
        - slug
        - createdByUserId
        - createdAt
        - updatedAt
      properties:
        leagueId:
          type: string
        name:
          type: string
        slug:
          type:
            - string
            - "null"
        createdByUserId:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Season:
      type: object
      required:
        - leagueId
        - seasonId
        - name
        - slug
        - startsOn
        - endsOn
        - createdAt
        - updatedAt
      properties:
        leagueId:
          type: string
        seasonId:
          type: string
        name:
          type: string
        slug:
          type:
            - string
            - "null"
        startsOn:
          type:
            - string
            - "null"
        endsOn:
          type:
            - string
            - "null"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Session:
      type: object
      required:
        - seasonId
        - sessionId
        - sessionDate
        - createdAt
        - updatedAt
      properties:
        seasonId:
          type: string
        sessionId:
          type: string
        sessionDate:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Game:
      type: object
      required:
        - gameId
        - leagueId
        - seasonId
        - sessionId
        - status
        - gameStartTs
        - createdAt
        - updatedAt
      properties:
        gameId:
          type: string
        leagueId:
          type: string
        seasonId:
          type: string
        sessionId:
          type: string
        status:
          type: string
          enum:
            - scheduled
            - live
            - finished
        gameStartTs:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    SeasonTeam:
      type: object
      required:
        - seasonId
        - teamId
        - name
        - color
        - createdAt
        - updatedAt
      properties:
        seasonId:
          type: string
        teamId:
          type: string
          enum:
            - red
            - blue
            - yellow
        name:
          type: string
        color:
          type:
            - string
            - "null"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    GameTeam:
      type: object
      required:
        - gameId
        - teamId
        - name
        - color
        - createdAt
        - updatedAt
      properties:
        gameId:
          type: string
        teamId:
          type: string
          enum:
            - red
            - blue
            - yellow
        name:
          type: string
        color:
          type:
            - string
            - "null"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Player:
      type: object
      required:
        - playerId
        - nickname
        - createdAt
        - updatedAt
      properties:
        playerId:
          type: string
        nickname:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    RosterAssignment:
      type: object
      required:
        - gameId
        - teamId
        - playerId
        - createdAt
        - updatedAt
      properties:
        gameId:
          type: string
        teamId:
          type: string
          enum:
            - red
            - blue
            - yellow
        playerId:
          type: string
        player:
          anyOf:
            - $ref: "#/components/schemas/Player"
            - type: "null"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    GameRosterResponse:
      type: object
      required:
        - teams
        - roster
      properties:
        teams:
          type: array
          items:
            $ref: "#/components/schemas/GameTeam"
        roster:
          type: array
          items:
            $ref: "#/components/schemas/RosterAssignment"
    ErrorResponse:
      type: object
      additionalProperties: true
      required:
        - error
      properties:
        error:
          type: string
        message:
          type: string
