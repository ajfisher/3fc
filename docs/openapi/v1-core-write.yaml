openapi: 3.1.0
info:
  title: 3FC Core API
  version: 0.1.0
  description: |
    Core routes for public join-code registration plus authenticated league/season/session/game creation,
    organiser invites, M2 roster setup, third timer control, goal scoring reads and writes, and game finish.
servers:
  - url: https://qa-api.3fc.football
    description: QA
  - url: https://api.3fc.football
    description: Production
paths:
  /v1/join:
    post:
      summary: Reject join registration without a join code
      operationId: rejectMissingJoinCode
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
  /v1/join/{joinCode}:
    post:
      summary: Register a nickname player into a game by join code
      operationId: joinGameByCode
      parameters:
        - name: joinCode
          in: path
          required: true
          schema:
            type: string
            minLength: 8
            maxLength: 8
            pattern: "^[ABCDEFGHJKLMNPQRSTUVWXYZabcdefghjklmnpqrstuvwxyz23456789]{8}$"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinGameRequest"
      responses:
        "201":
          description: Player registered for the game
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinGameResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/JoinGameConflict"
  /v1/leagues:
    post:
      summary: Create league
      operationId: createLeague
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLeagueRequest"
      responses:
        "201":
          description: League created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/League"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
  /v1/leagues/{leagueId}/access:
    post:
      summary: Grant league scoring or co-organiser access
      operationId: grantLeagueAccess
      parameters:
        - name: leagueId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GrantLeagueAccessRequest"
      responses:
        "200":
          description: League access granted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeagueAccessGrant"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/leagues/{leagueId}/organiser-invites:
    post:
      summary: Create or ensure a league organiser invite
      description: >-
        With no email, ensures and returns the league's reusable share invite.
        With an email, creates a one-time, email-restricted invite and starts
        direct magic-link delivery.
      operationId: createLeagueOrganiserInvite
      parameters:
        - name: leagueId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLeagueOrganiserInviteRequest"
      responses:
        "201":
          description: Organiser invite created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateLeagueOrganiserInviteResponse"
        "202":
          description: Organiser invite created, but direct email delivery could not be confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateLeagueOrganiserInviteResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/invites/{inviteCode}/accept:
    post:
      summary: Accept a league organiser invite
      description: >-
        Grants league admin access. Reusable share invites remain active after
        acceptance; one-time email invites are consumed on first acceptance and
        require the signed-in email to match the invite email.
      operationId: acceptLeagueOrganiserInvite
      parameters:
        - name: inviteCode
          in: path
          required: true
          schema:
            type: string
            minLength: 8
            maxLength: 8
            pattern: "^[ABCDEFGHJKLMNPQRSTUVWXYZabcdefghjklmnpqrstuvwxyz23456789]{8}$"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptLeagueOrganiserInviteRequest"
      responses:
        "200":
          description: Organiser invite accepted and league admin access granted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptLeagueOrganiserInviteResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/leagues/{leagueId}/seasons:
    post:
      summary: Create season
      operationId: createSeason
      parameters:
        - name: leagueId
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSeasonRequest"
      responses:
        "201":
          description: Season created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Season"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
  /v1/leagues/{leagueId}/seasons/{seasonId}:
    get:
      summary: Get a league-scoped season
      description: >-
        Resolves a season within its league so reused season slugs or IDs in
        another league cannot select the wrong season.
      operationId: getLeagueSeason
      parameters:
        - name: leagueId
          in: path
          required: true
          schema:
            type: string
        - name: seasonId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Season found within the league
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Season"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      summary: Delete a league-scoped season
      description: >-
        Deletes the season only from the requested league. The season must have
        no remaining scoped sessions or games.
      operationId: deleteLeagueSeason
      parameters:
        - name: leagueId
          in: path
          required: true
          schema:
            type: string
        - name: seasonId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Season deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/leagues/{leagueId}/seasons/{seasonId}/sessions:
    post:
      summary: Create a session for a league-scoped season
      description: >-
        Creates the session after resolving the season within the requested
        league, avoiding global season ID ambiguity.
      operationId: createLeagueSeasonSession
      parameters:
        - name: leagueId
          in: path
          required: true
          schema:
            type: string
        - name: seasonId
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
      responses:
        "201":
          description: Session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
  /v1/leagues/{leagueId}/seasons/{seasonId}/games:
    get:
      summary: List games for a league-scoped season
      description: >-
        Lists games only when both the session index and loaded game metadata
        belong to the requested league and season.
      operationId: listLeagueSeasonGames
      parameters:
        - name: leagueId
          in: path
          required: true
          schema:
            type: string
        - name: seasonId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: League-scoped season games
          content:
            application/json:
              schema:
                type: object
                required:
                  - games
                properties:
                  games:
                    type: array
                    items:
                      $ref: "#/components/schemas/Game"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/leagues/{leagueId}/seasons/{seasonId}/sessions/{sessionId}/games:
    post:
      summary: Create a game for a league-scoped season session
      description: >-
        Creates a game with explicit league, season, and session scope so reused
        season IDs cannot attach the game to another league.
      operationId: createLeagueSeasonSessionGame
      parameters:
        - name: leagueId
          in: path
          required: true
          schema:
            type: string
        - name: seasonId
          in: path
          required: true
          schema:
            type: string
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGameRequest"
      responses:
        "201":
          description: Game created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/CreateGameConflict"
  /v1/seasons/{seasonId}/sessions:
    post:
      summary: Create session
      operationId: createSession
      parameters:
        - name: seasonId
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
      responses:
        "201":
          description: Session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
  /v1/sessions/{sessionId}/games:
    post:
      summary: Create game
      operationId: createGame
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGameRequest"
      responses:
        "201":
          description: Game created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/CreateGameConflict"
  /v1/games/{gameId}/thirds/{third}/start:
    post:
      summary: Start a game third timer
      operationId: startGameThird
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/ThirdNumber"
      responses:
        "200":
          description: Third started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/games/{gameId}/thirds/{third}/finish:
    post:
      summary: Finish a game third timer
      operationId: finishGameThird
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/ThirdNumber"
      responses:
        "200":
          description: Third finished
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/games/{gameId}/finish:
    post:
      summary: Finish a game and compute final result
      operationId: finishGame
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Game finished with deterministic winner or draw result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/games/{gameId}/goals:
    get:
      summary: List game goal timeline and scoreboard
      operationId: listGameGoals
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Current scoreboard and goal timeline for the game
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameGoalsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      summary: Create a goal event and update game scoring tallies
      operationId: createGoal
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGoalRequest"
      responses:
        "201":
          description: Goal created with updated scoreboard and timeline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateGoalResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: State conflict, including no running third, idempotency conflict, duplicate goal request, or stale scoreboard state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/games/{gameId}/goals/undo-last:
    post:
      summary: Delete the current most recent goal event
      operationId: undoLastGoal
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UndoLastGoalRequest"
      responses:
        "200":
          description: Latest goal deleted with updated scoreboard, timeline, and audit entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteGoalResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/games/{gameId}/goals/{eventId}:
    patch:
      summary: Correct an existing goal event without changing its timer stamp
      operationId: updateGoal
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: string
        - name: eventId
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateGoalRequest"
      responses:
        "200":
          description: Goal updated with recalculated scoreboard, timeline, and audit entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateGoalResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      summary: Delete a goal event and recompute game scoring tallies
      operationId: deleteGoal
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: string
        - name: eventId
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Goal deleted with recalculated scoreboard, timeline, and audit entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteGoalResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/seasons/{seasonId}/teams:
    get:
      summary: List season default teams
      operationId: listSeasonTeams
      parameters:
        - name: seasonId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Season teams
          content:
            application/json:
              schema:
                type: object
                required:
                  - teams
                properties:
                  teams:
                    type: array
                    items:
                      $ref: "#/components/schemas/SeasonTeam"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/seasons/{seasonId}/teams/{teamId}:
    put:
      summary: Upsert season default team
      operationId: upsertSeasonTeam
      parameters:
        - name: seasonId
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/TeamId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertTeamRequest"
      responses:
        "200":
          description: Season team upserted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeasonTeam"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/games/{gameId}/teams:
    get:
      summary: List game teams
      operationId: listGameTeams
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Game teams
          content:
            application/json:
              schema:
                type: object
                required:
                  - teams
                properties:
                  teams:
                    type: array
                    items:
                      $ref: "#/components/schemas/GameTeam"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/games/{gameId}/teams/{teamId}:
    put:
      summary: Upsert game team override
      operationId: upsertGameTeam
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/TeamId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertTeamRequest"
      responses:
        "200":
          description: Game team upserted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameTeam"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/players/{playerId}/claim:
    post:
      summary: Claim a joined player for the signed-in user
      operationId: claimPlayer
      parameters:
        - name: playerId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimPlayerRequest"
      responses:
        "200":
          description: Player claimed for the current signed-in user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimPlayerResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/games/{gameId}/players:
    get:
      summary: List recent/searchable players for a game roster
      operationId: listGamePlayers
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: string
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Player list
          content:
            application/json:
              schema:
                type: object
                required:
                  - players
                properties:
                  players:
                    type: array
                    items:
                      $ref: "#/components/schemas/Player"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      summary: Quick-create a nickname player in game setup
      operationId: quickCreateGamePlayer
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuickCreateGamePlayerRequest"
      responses:
        "201":
          description: Player created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
  /v1/games/{gameId}/roster:
    get:
      summary: Read game roster
      operationId: listGameRoster
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Game roster with teams and player nicknames
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameRosterResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/games/{gameId}/roster/{playerId}:
    put:
      summary: Assign or reassign a player to a game team
      operationId: assignRosterPlayer
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: string
        - name: playerId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignRosterPlayerRequest"
      responses:
        "200":
          description: Roster assignment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RosterAssignment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 128
      description: Optional idempotency key for replay-safe writes.
    TeamId:
      name: teamId
      in: path
      required: true
      schema:
        type: string
        enum:
          - red
          - blue
          - yellow
    ThirdNumber:
      name: third
      in: path
      required: true
      schema:
        type: integer
        enum:
          - 1
          - 2
          - 3
  responses:
    BadRequest:
      description: Request body or headers failed validation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Missing or invalid session
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Caller does not have required ACL permissions
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Referenced parent entity not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: State transition or idempotent write rejected
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RateLimited:
      description: Direct email invite delivery rate limit exceeded
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    CreateGameConflict:
      description: Idempotency key was reused with a different request payload, or the game/join code already exists
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    JoinGameConflict:
      description: Idempotency key was reused with a different request payload, or the join state changed while registering
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    IdempotencyConflict:
      description: Idempotency key was reused with a different request payload
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    CreateLeagueRequest:
      type: object
      additionalProperties: false
      required:
        - leagueId
        - name
      properties:
        leagueId:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        slug:
          type:
            - string
            - "null"
    CreateSeasonRequest:
      type: object
      additionalProperties: false
      required:
        - seasonId
        - name
      properties:
        seasonId:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        slug:
          type:
            - string
            - "null"
        startsOn:
          type:
            - string
            - "null"
        endsOn:
          type:
            - string
            - "null"
    CreateSessionRequest:
      type: object
      additionalProperties: false
      required:
        - sessionId
        - sessionDate
      properties:
        sessionId:
          type: string
          minLength: 1
        sessionDate:
          type: string
          minLength: 1
    CreateGameRequest:
      type: object
      additionalProperties: false
      required:
        - gameId
        - gameStartTs
      properties:
        gameId:
          type: string
          minLength: 1
        gameStartTs:
          type: string
          minLength: 1
        status:
          type: string
          enum:
            - scheduled
            - live
        thirdLengthMinutes:
          type: integer
          enum:
            - 20
            - 25
            - 30
          default: 20
    UpsertTeamRequest:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
        color:
          type:
            - string
            - "null"
    QuickCreateGamePlayerRequest:
      type: object
      additionalProperties: false
      required:
        - nickname
      properties:
        playerId:
          type: string
          minLength: 1
        nickname:
          type: string
          minLength: 1
    JoinGameRequest:
      type: object
      additionalProperties: false
      required:
        - nickname
      properties:
        nickname:
          type: string
          minLength: 1
          maxLength: 80
    ClaimPlayerRequest:
      type: object
      additionalProperties: false
    GrantLeagueAccessRequest:
      type: object
      additionalProperties: false
      required:
        - userId
        - role
      properties:
        userId:
          type: string
          minLength: 1
        role:
          type: string
          enum:
            - admin
            - scorekeeper
    CreateLeagueOrganiserInviteRequest:
      type: object
      additionalProperties: false
      properties:
        email:
          type:
            - string
            - "null"
          format: email
          description: >-
            Optional email restriction. When omitted or null, the API ensures the
            reusable league share invite. When present, the API creates a
            one-time email invite and sends a magic-link invite to this email.
    AcceptLeagueOrganiserInviteRequest:
      type: object
      additionalProperties: false
    AssignRosterPlayerRequest:
      type: object
      additionalProperties: false
      required:
        - teamId
      properties:
        teamId:
          type: string
          enum:
            - red
            - blue
            - yellow
    CreateGoalRequest:
      type: object
      additionalProperties: false
      required:
        - scoringTeamId
        - concedingTeamId
        - scorerPlayerId
        - ownGoal
      properties:
        scoringTeamId:
          type:
            - string
            - "null"
          enum:
            - red
            - blue
            - yellow
            - null
        concedingTeamId:
          type: string
          enum:
            - red
            - blue
            - yellow
        scorerPlayerId:
          type: string
          minLength: 1
        assistPlayerIds:
          type: array
          default: []
          maxItems: 3
          uniqueItems: true
          items:
            type: string
            minLength: 1
        ownGoal:
          type: boolean
    UpdateGoalRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        scoringTeamId:
          type:
            - string
            - "null"
          enum:
            - red
            - blue
            - yellow
            - null
        concedingTeamId:
          type: string
          enum:
            - red
            - blue
            - yellow
        scorerPlayerId:
          type: string
          minLength: 1
        assistPlayerIds:
          type: array
          maxItems: 3
          items:
            type: string
            minLength: 1
          uniqueItems: true
        ownGoal:
          type: boolean
    UndoLastGoalRequest:
      type: object
      additionalProperties: false
      required:
        - expectedEventId
      properties:
        expectedEventId:
          type: string
          minLength: 1
    League:
      type: object
      required:
        - leagueId
        - name
        - slug
        - createdByUserId
        - createdAt
        - updatedAt
      properties:
        leagueId:
          type: string
        name:
          type: string
        slug:
          type:
            - string
            - "null"
        createdByUserId:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        access:
          type: object
          additionalProperties: false
          properties:
            role:
              type: string
              enum:
                - admin
                - scorekeeper
                - viewer
    Season:
      type: object
      required:
        - leagueId
        - seasonId
        - name
        - slug
        - startsOn
        - endsOn
        - createdAt
        - updatedAt
      properties:
        leagueId:
          type: string
        seasonId:
          type: string
        name:
          type: string
        slug:
          type:
            - string
            - "null"
        startsOn:
          type:
            - string
            - "null"
        endsOn:
          type:
            - string
            - "null"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Session:
      type: object
      required:
        - seasonId
        - sessionId
        - sessionDate
        - createdAt
        - updatedAt
      properties:
        seasonId:
          type: string
        sessionId:
          type: string
        sessionDate:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Game:
      type: object
      required:
        - gameId
        - joinCode
        - leagueId
        - seasonId
        - sessionId
        - status
        - gameStartTs
        - thirdLengthMinutes
        - thirds
        - finishedAt
        - result
        - timer
        - createdAt
        - updatedAt
      properties:
        gameId:
          type: string
        joinCode:
          type: string
        leagueId:
          type: string
        seasonId:
          type: string
        sessionId:
          type: string
        status:
          type: string
          enum:
            - scheduled
            - live
            - finished
        gameStartTs:
          type: string
        thirdLengthMinutes:
          type: integer
          enum:
            - 20
            - 25
            - 30
        thirds:
          type: array
          minItems: 3
          maxItems: 3
          items:
            $ref: "#/components/schemas/ThirdTimerSegment"
        finishedAt:
          type:
            - string
            - "null"
          format: date-time
        result:
          oneOf:
            - $ref: "#/components/schemas/GameResult"
            - type: "null"
        timer:
          $ref: "#/components/schemas/GameTimerState"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    GameResult:
      type: object
      required:
        - winnerTeamId
        - outcome
        - comparator
        - computedAt
        - teams
      properties:
        winnerTeamId:
          type:
            - string
            - "null"
          enum:
            - red
            - blue
            - yellow
            - null
        outcome:
          type: string
          enum:
            - win
            - draw
        comparator:
          type: string
          enum:
            - fewest_conceded_then_most_scored
        computedAt:
          type: string
          format: date-time
        teams:
          type: array
          minItems: 3
          maxItems: 3
          items:
            $ref: "#/components/schemas/GameResultTeam"
    GameResultTeam:
      type: object
      required:
        - teamId
        - name
        - color
        - scored
        - conceded
        - rank
        - outcome
      properties:
        teamId:
          type: string
          enum:
            - red
            - blue
            - yellow
        name:
          type: string
        color:
          type:
            - string
            - "null"
        scored:
          type: integer
          minimum: 0
        conceded:
          type: integer
          minimum: 0
        rank:
          type: integer
          minimum: 1
        outcome:
          type: string
          enum:
            - win
            - draw
            - loss
    ThirdTimerSegment:
      type: object
      required:
        - third
        - startedAt
        - finishedAt
      properties:
        third:
          type: integer
          enum:
            - 1
            - 2
            - 3
        startedAt:
          type:
            - string
            - "null"
          format: date-time
        finishedAt:
          type:
            - string
            - "null"
          format: date-time
    ThirdTimerState:
      allOf:
        - $ref: "#/components/schemas/ThirdTimerSegment"
        - type: object
          required:
            - status
          properties:
            status:
              type: string
              enum:
                - not_started
                - running
                - finished
    GameTimerState:
      type: object
      required:
        - thirdLengthMinutes
        - activeThird
        - status
        - thirds
      properties:
        thirdLengthMinutes:
          type: integer
          enum:
            - 20
            - 25
            - 30
        activeThird:
          type:
            - integer
            - "null"
          enum:
            - 1
            - 2
            - 3
            - null
        status:
          type: string
          enum:
            - not_started
            - running
            - between_thirds
            - complete
        thirds:
          type: array
          minItems: 3
          maxItems: 3
          items:
            $ref: "#/components/schemas/ThirdTimerState"
    SeasonTeam:
      type: object
      required:
        - seasonId
        - teamId
        - name
        - color
        - createdAt
        - updatedAt
      properties:
        seasonId:
          type: string
        teamId:
          type: string
          enum:
            - red
            - blue
            - yellow
        name:
          type: string
        color:
          type:
            - string
            - "null"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    GameTeam:
      type: object
      required:
        - gameId
        - teamId
        - name
        - color
        - scored
        - conceded
        - createdAt
        - updatedAt
      properties:
        gameId:
          type: string
        teamId:
          type: string
          enum:
            - red
            - blue
            - yellow
        name:
          type: string
        color:
          type:
            - string
            - "null"
        scored:
          type: integer
          minimum: 0
        conceded:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Player:
      type: object
      required:
        - playerId
        - nickname
        - createdAt
        - updatedAt
      properties:
        playerId:
          type: string
        nickname:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        access:
          $ref: "#/components/schemas/PlayerAccess"
    PlayerAccess:
      type: object
      description: Present only to league admins when the player has claimed a signed-in user account.
      required:
        - userId
        - role
      properties:
        userId:
          type: string
        role:
          type:
            - string
            - "null"
          enum:
            - admin
            - scorekeeper
            - viewer
            - null
    ClaimPlayerResponse:
      type: object
      required:
        - player
        - claim
      properties:
        player:
          $ref: "#/components/schemas/Player"
        claim:
          type: object
          required:
            - claimedByCurrentUser
          properties:
            claimedByCurrentUser:
              type: boolean
    LeagueAccessGrant:
      type: object
      required:
        - leagueId
        - userId
        - role
        - grantedByUserId
        - createdAt
        - updatedAt
      properties:
        leagueId:
          type: string
        userId:
          type: string
        role:
          type: string
          enum:
            - admin
            - scorekeeper
            - viewer
        grantedByUserId:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    LeagueOrganiserInvite:
      type: object
      required:
        - leagueId
        - inviteCode
        - kind
        - role
        - email
        - createdByUserId
        - acceptedByUserId
        - acceptedAt
        - createdAt
        - updatedAt
      properties:
        leagueId:
          type: string
        inviteCode:
          type: string
          minLength: 8
          maxLength: 8
          pattern: "^[ABCDEFGHJKLMNPQRSTUVWXYZ23456789]{8}$"
        kind:
          type: string
          enum:
            - share
            - email
          description: >-
            Share invites are reusable league-level codes and are not consumed
            when accepted. Email invites are one-time and restricted to the
            invited email.
        role:
          type: string
          enum:
            - admin
        email:
          type:
            - string
            - "null"
          format: email
        createdByUserId:
          type: string
        acceptedByUserId:
          type:
            - string
            - "null"
        acceptedAt:
          type:
            - string
            - "null"
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    LeagueOrganiserInviteEmailDelivery:
      type:
        - object
        - "null"
      required:
        - status
        - email
        - expiresAt
        - messageId
      properties:
        status:
          type: string
          enum:
            - sent
            - unknown
        email:
          type: string
          format: email
        expiresAt:
          type:
            - string
            - "null"
          format: date-time
        messageId:
          type:
            - string
            - "null"
        message:
          type: string
    CreateLeagueOrganiserInviteResponse:
      type: object
      required:
        - invite
        - inviteCode
        - inviteLink
        - emailDelivery
      properties:
        invite:
          $ref: "#/components/schemas/LeagueOrganiserInvite"
        inviteCode:
          type: string
        inviteLink:
          type: string
          format: uri
        emailDelivery:
          $ref: "#/components/schemas/LeagueOrganiserInviteEmailDelivery"
    AcceptLeagueOrganiserInviteResponse:
      type: object
      required:
        - invite
        - access
        - inviteLink
      properties:
        invite:
          $ref: "#/components/schemas/LeagueOrganiserInvite"
        access:
          $ref: "#/components/schemas/LeagueAccessGrant"
        inviteLink:
          type: string
          format: uri
    JoinGameResponse:
      type: object
      required:
        - gameId
        - joinCode
        - player
      properties:
        gameId:
          type: string
        joinCode:
          type: string
        player:
          $ref: "#/components/schemas/Player"
    RosterAssignment:
      type: object
      required:
        - gameId
        - teamId
        - playerId
        - createdAt
        - updatedAt
      properties:
        gameId:
          type: string
        teamId:
          type: string
          enum:
            - red
            - blue
            - yellow
        playerId:
          type: string
        player:
          anyOf:
            - $ref: "#/components/schemas/Player"
            - type: "null"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    GameRosterResponse:
      type: object
      required:
        - teams
        - roster
      properties:
        teams:
          type: array
          items:
            $ref: "#/components/schemas/GameTeam"
        roster:
          type: array
          items:
            $ref: "#/components/schemas/RosterAssignment"
    GoalEvent:
      type: object
      required:
        - gameId
        - eventId
        - third
        - thirdMinute
        - gameMinute
        - elapsedSeconds
        - stoppageMinute
        - displayTime
        - scoringTeamId
        - concedingTeamId
        - scorerPlayerId
        - assistPlayerIds
        - ownGoal
        - createdAt
        - updatedAt
      properties:
        gameId:
          type: string
        eventId:
          type: string
        third:
          type: integer
          enum:
            - 1
            - 2
            - 3
        thirdMinute:
          type: integer
          minimum: 1
        gameMinute:
          type: integer
          minimum: 1
        elapsedSeconds:
          type: integer
          minimum: 0
        stoppageMinute:
          type:
            - integer
            - "null"
          minimum: 1
        displayTime:
          type: string
        scoringTeamId:
          type:
            - string
            - "null"
          enum:
            - red
            - blue
            - yellow
            - null
        concedingTeamId:
          type: string
          enum:
            - red
            - blue
            - yellow
        scorerPlayerId:
          type: string
        assistPlayerIds:
          type: array
          maxItems: 3
          items:
            type: string
        ownGoal:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    GoalAuditSnapshot:
      type: object
      required:
        - eventId
        - third
        - thirdMinute
        - gameMinute
        - elapsedSeconds
        - stoppageMinute
        - displayTime
        - scoringTeamId
        - concedingTeamId
        - scorerPlayerId
        - assistPlayerIds
        - ownGoal
      properties:
        eventId:
          type: string
        third:
          type: integer
          enum:
            - 1
            - 2
            - 3
        thirdMinute:
          type: integer
          minimum: 1
        gameMinute:
          type: integer
          minimum: 1
        elapsedSeconds:
          type: integer
          minimum: 0
        stoppageMinute:
          type:
            - integer
            - "null"
          minimum: 1
        displayTime:
          type: string
        scoringTeamId:
          type:
            - string
            - "null"
          enum:
            - red
            - blue
            - yellow
            - null
        concedingTeamId:
          type: string
          enum:
            - red
            - blue
            - yellow
        scorerPlayerId:
          type: string
        assistPlayerIds:
          type: array
          maxItems: 3
          items:
            type: string
        ownGoal:
          type: boolean
    GoalAuditEntry:
      type: object
      required:
        - auditId
        - gameId
        - eventId
        - actorUserId
        - action
        - before
        - after
        - createdAt
        - updatedAt
      properties:
        auditId:
          type: string
        gameId:
          type: string
        eventId:
          type: string
        actorUserId:
          type: string
        action:
          type: string
          enum:
            - goal_created
            - goal_updated
            - goal_deleted
            - goal_undo_last
        before:
          oneOf:
            - $ref: "#/components/schemas/GoalAuditSnapshot"
            - type: "null"
        after:
          oneOf:
            - $ref: "#/components/schemas/GoalAuditSnapshot"
            - type: "null"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    GameScoreboard:
      type: object
      required:
        - teams
      properties:
        teams:
