            application/json:
              schema:
                $ref: "#/components/schemas/ClaimPlayerResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/PlayerLinkingUnavailable"
  /v1/player-proofs/preview:
    post:
      summary: Preview a private player link without consuming it
      operationId: previewPlayerProof
      description: Requires a session. Returns the exact player, league and signed-in account together with an opaque session-bound confirmation. Never grants ownership. Responses are no-store and no-referrer; secrets and confirmations must never be logged.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlayerProofCredential"
      responses:
        "200":
          description: Account-bound preview, including same-owner consumed receipt recovery
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerProofPreviewResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/PlayerLinkingUnavailable"
  /v1/games/{gameId}/players/{playerId}/profile-invitation:
    parameters:
      - name: gameId
        in: path
        required: true
        schema: { type: string, minLength: 1 }
      - name: playerId
        in: path
        required: true
        schema: { type: string, minLength: 1 }
    get:
      summary: Check the current private invitation for a registered player
      operationId: getPlayerInvitation
      description: League organisers only. Returns metadata, never a bearer secret. A TTL-deleted proof retains expired pointer metadata so the organiser can replace it safely.
      responses:
        "200":
          description: Current invitation metadata or null
          content:
            application/json:
              schema:
                type: object
                required: [invitation]
                properties:
                  invitation:
                    anyOf:
                      - $ref: "#/components/schemas/PlayerInvitationMetadata"
                      - type: "null"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      summary: Create or replace a private profile-link invitation
      operationId: createPlayerInvitation
      description: League organisers only. The client retains the random secret and submits its SHA-256 verifier. Creation is idempotent by proofId and exact inputs. Replacement must name the current predecessor proofId; a stale predecessor conflicts. Invites expire seven days after the persisted creation instant. No email is sent. All responses are no-store and no-referrer.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePlayerInvitationRequest"
      responses:
        "201":
          description: Persisted invitation metadata, also returned for an exact retry while the invitation remains pending, current and valid. Consumed, revoked, replaced or expired invitation retries return 409.
          content:
            application/json:
              schema:
                type: object
                required: [invitation]
                properties:
                  invitation:
                    $ref: "#/components/schemas/PlayerProofMetadata"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/PlayerLinkingUnavailable"
  /v1/games/{gameId}/players/{playerId}/profile-invitation/revoke:
    post:
      summary: Revoke a player's private invitation
      operationId: revokePlayerInvitation
      description: League organisers only. Idempotent; revocation does not remove existing ownership or a consumed receipt.
      parameters:
        - name: gameId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
        - name: playerId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [proofId]
              properties:
                proofId: { type: string, pattern: "^[A-Za-z0-9_-]{20,64}$" }
      responses:
        "200":
          description: Revocation confirmed, including an already revoked or consumed invitation
          content:
            application/json:
              schema:
                type: object
                required: [revoked]
                properties:
                  revoked: { type: boolean, const: true }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /v1/games/{gameId}/players:
    get:
      summary: List recent/searchable players for a game roster
      operationId: listGamePlayers
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: string
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Player list
          content:
            application/json:
              schema:
                type: object
                required:
                  - players
                properties:
                  players:
                    type: array
                    items:
                      $ref: "#/components/schemas/Player"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      summary: Quick-create a nickname player in game setup
      operationId: quickCreateGamePlayer
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuickCreateGamePlayerRequest"
      responses:
        "201":
          description: Player created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
  /v1/games/{gameId}/roster:
    get:
      summary: Read game roster
      operationId: listGameRoster
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Game roster with teams and player nicknames
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameRosterResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/games/{gameId}/roster/{playerId}:
    put:
      summary: Assign or reassign a player to a game team
      operationId: assignRosterPlayer
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: string
        - name: playerId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignRosterPlayerRequest"
      responses:
        "200":
          description: Roster assignment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RosterAssignment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  parameters:
    OwnedJoinCode:
      name: joinCode
      in: path
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 8
        pattern: '^[ABCDEFGHJKLMNPQRSTUVWXYZabcdefghjklmnpqrstuvwxyz23456789]{8}$'
    DirectoryLeagueId:
      name: leagueId
      in: query
      required: true
      description: Opaque identifier, URL-encoded and decoded exactly once. Duplicate or unknown query parameters are rejected.
      schema:
        $ref: "#/components/schemas/DirectoryIdentifier"
    DirectoryGameId:
      name: gameId
      in: query
      required: true
      description: Opaque identifier, URL-encoded and decoded exactly once. Duplicate or unknown query parameters are rejected.
      schema:
        $ref: "#/components/schemas/DirectoryIdentifier"
    DirectoryPlayerId:
      name: playerId
      in: query
      required: true
      description: Opaque identifier, URL-encoded and decoded exactly once. Duplicate or unknown query parameters are rejected.
      schema:
        $ref: "#/components/schemas/DirectoryIdentifier"
    DirectorySeasonId:
      name: seasonId
      in: query
      required: false
      description: Opaque identifier, URL-encoded and decoded exactly once. Duplicate or unknown query parameters are rejected.
      schema:
        $ref: "#/components/schemas/DirectorySeasonIdentifier"
    DirectorySearch:
      name: query
      in: query
      schema: { type: string, maxLength: 100 }
      description: Nickname or retained former nickname; not an account search.
    DirectoryGameContext:
      name: gameId
      in: query
      required: false
      description: Optional same-league game used to report existing registration, including canonical aliases. Bound into the continuation cursor.
      schema:
        $ref: "#/components/schemas/DirectoryIdentifier"
    DirectoryCursor:
      name: cursor
      in: query
      schema: { type: string, minLength: 1, maxLength: 8000 }
      description: Opaque continuation returned by the same scope and query.
    DirectoryLimit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 50, default: 25 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 128
      description: Optional idempotency key for replay-safe writes.
    TeamId:
      name: teamId
      in: path
      required: true
      schema:
        type: string
        enum:
          - red
          - blue
          - yellow
    ThirdNumber:
      name: third
      in: path
      required: true
      schema:
        type: integer
        enum:
          - 1
          - 2
          - 3
  responses:
    OwnedJoinUnavailable:
      description: Returning-player feature is disabled, directory cutover is incomplete, or linked identities cannot be safely checked. Retry later; do not automatically create a duplicate player.
      headers:
        Cache-Control: { schema: { type: string, const: no-store } }
        Referrer-Policy: { schema: { type: string, const: no-referrer } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ConsolidationProposal:
      description: Private proposal state; no account identifiers or bearer material
      headers:
        Cache-Control:
          schema:
            type: string
            const: no-store
        Referrer-Policy:
          schema:
            type: string
            const: no-referrer
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [proposal]
            properties:
              proposal:
                $ref: '#/components/schemas/PlayerConsolidation'
    PlayerDirectoryUnavailable:
      description: Identity migration is paused or the reviewed directory cutover is not yet active. No new mutation is committed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalServerError:
      description: The request could not be completed because of an internal or storage failure
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PlayerLinkingUnavailable:
      description: New player linking is temporarily disabled (code claims_unavailable). This response does not commit a new claim or invitation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BadRequest:
      description: Request body or headers failed validation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Missing or invalid session
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Caller does not have required ACL permissions
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Referenced parent entity not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: State transition or idempotent write rejected
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RateLimited:
      description: Direct email invite delivery rate limit exceeded
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    CreateGameConflict:
      description: Idempotency key was reused with a different request payload, or the game/join code already exists
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    JoinGameConflict:
      description: Idempotency key was reused with a different request payload, or the join state changed while registering
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    IdempotencyConflict:
      description: Idempotency key was reused with a different request payload
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    OwnedJoinTeam:
      type: [object, 'null']
      additionalProperties: false
      required: [teamId, name, color]
      properties:
        teamId: { type: string, enum: [red, blue, yellow] }
        name: { type: string, minLength: 1 }
        color: { type: [string, 'null'], minLength: 1 }
    OwnedJoinPage:
      type: object
      additionalProperties: false
      required: [accountId, gameId, leagueId, players, cursor, complete]
      description: complete is true if and only if cursor is null. Empty players with a cursor is not an empty account result.
      properties:
        accountId: { type: string, minLength: 1, maxLength: 2048 }
        gameId: { type: string, minLength: 1 }
        leagueId: { type: string, minLength: 1 }
        cursor: { type: [string, 'null'], minLength: 1, maxLength: 8000 }
        complete: { type: boolean }
        players:
          type: array
          maxItems: 20
          items:
            type: object
            additionalProperties: false
            required: [playerId, nickname, registeredPlayerId, team, seasons]
            properties:
              playerId: { $ref: '#/components/schemas/DirectoryIdentifier' }
              nickname: { type: string, minLength: 1 }
              registeredPlayerId:
                anyOf:
                  - $ref: '#/components/schemas/DirectoryIdentifier'
                  - type: 'null'
                description: Original identity registered in this game, or null when not registered.
              team: { $ref: '#/components/schemas/OwnedJoinTeam' }
              seasons:
                type: array
                maxItems: 3
                items:
                  type: object
                  additionalProperties: false
                  required: [seasonId, name]
                  properties:
                    seasonId: { type: string, minLength: 1 }
                    name: { type: string, minLength: 1 }
    OwnedJoinResult:
      type: object
      additionalProperties: false
      required: [accountId, gameId, joinCode, player, link, alreadyRegistered, team]
      description: link.gameId equals gameId and link.playerId equals player.playerId. Receipt replay retains the original outcome snapshot.
      properties:
        accountId: { type: string, minLength: 1, maxLength: 2048 }
        gameId: { type: string, minLength: 1 }
        joinCode: { type: string, minLength: 1 }
        alreadyRegistered: { type: boolean }
        team: { $ref: '#/components/schemas/OwnedJoinTeam' }
        player:
          type: object
          additionalProperties: false
          required: [playerId, nickname]
          properties:
            playerId: { $ref: '#/components/schemas/DirectoryIdentifier' }
            nickname: { type: string, minLength: 1 }
        link:
          type: object
          additionalProperties: false
          required: [gameId, playerId]
          properties:
            gameId: { type: string, minLength: 1 }
            playerId: { $ref: '#/components/schemas/DirectoryIdentifier' }
    ConsolidationPreviewRequest:
      type: object
      additionalProperties: false
      required: [proposalId, leagueId, playerIds, retainedPlayerId, nickname, expectedAccountId]
      properties:
        expectedAccountId:
          type: string
          minLength: 1
          maxLength: 2048
        proposalId:
          type: string
          pattern: '^[A-Za-z0-9_-]{20,64}$'
        leagueId:
          type: string
          minLength: 1
        playerIds:
          type: array
          minItems: 2
          maxItems: 20
          uniqueItems: true
          items:
            type: string
            minLength: 1
        retainedPlayerId:
          type: string
          minLength: 1
        nickname:
          type: string
          minLength: 1
          maxLength: 80
    PlayerConsolidation:
      type: object
      additionalProperties: false
      required: [proposalId, leagueId, leagueName, retainedPlayerId, nickname, status, profiles, blockers, requiresApproval, canApprove, canCommit]
      properties:
        proposalId:
          type: string
        leagueId:
          type: string
        leagueName:
          type: string
        retainedPlayerId:
          type: string
        nickname:
          type: string
        status:
          type: string
          enum: [pending_approval, ready, declined, committed, stale]
        profiles:
          type: array
          minItems: 2
          maxItems: 20
          items:
            type: object
            additionalProperties: false
            required: [playerId, nickname, claimed, games]
            properties:
              playerId:
                type: string
              nickname:
                type: string
              claimed:
                type: boolean
              games:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [gameId, kickoffAt]
                  properties:
                    gameId:
                      type: string
                    kickoffAt:
                      type: string
                      format: date-time
        blockers:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [code, message]
            properties:
              code:
                type: string
              message:
                type: string
        requiresApproval:
          type: boolean
        canApprove:
          type: boolean
        canCommit:
          type: boolean
    DirectoryIdentifier:
      type: string
      minLength: 1
      description: Non-blank, well-formed Unicode opaque identifier. Its constructed PLAYER#, LEAGUE# or GAME# partition key must fit 2048 UTF-8 bytes. Game registration and team assignment additionally require their constructed sort keys to fit 1024 bytes. No character-count cap narrows historical reads.
    DirectorySeasonIdentifier:
      type: string
      minLength: 1
      description: Non-blank, well-formed Unicode opaque identifier whose constructed SEASON# sort key fits 1024 UTF-8 bytes.
    CreateLeaguePlayerRequest:
      type: object
      additionalProperties: false
      required: [playerId, nickname]
      properties:
        playerId: { $ref: "#/components/schemas/DirectoryIdentifier" }
        nickname: { type: string, minLength: 1, maxLength: 80 }
    CreateLeaguePlayerResponse:
      type: object
      additionalProperties: false
      required: [player]
      properties:
        player:
          type: object
          additionalProperties: false
          required: [playerId, nickname]
          properties:
            playerId: { $ref: "#/components/schemas/DirectoryIdentifier" }
            nickname: { type: string, minLength: 1 }
    LeaguePlayerPage:
      type: object
      additionalProperties: false
      required: [players, cursor]
      properties:
        cursor: { type: [string, "null"] }
        players:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [playerId, nickname, claimed, seasons, hasMoreSeasons]
            properties:
              playerId: { $ref: "#/components/schemas/DirectoryIdentifier" }
              nickname: { type: string, minLength: 1 }
              claimed: { type: boolean }
              inGame: { type: boolean, description: Present only when gameId is supplied; registration is checked across the complete canonical alias group. }
              hasMoreSeasons: { type: boolean }
              seasons:
                type: array
                maxItems: 3
                items:
                  type: object
                  additionalProperties: false
                  required: [seasonId, name]
                  properties:
                    seasonId: { $ref: "#/components/schemas/DirectorySeasonIdentifier" }
                    name: { type: string, minLength: 1 }
    AddExistingLeaguePlayerRequest:
      type: object
      additionalProperties: false
      required: [playerId]
      properties:
        playerId: { $ref: "#/components/schemas/DirectoryIdentifier" }
        teamId: { type: [string, "null"], enum: [red, blue, yellow, null] }
        allowFinished: { type: boolean }
    AddExistingLeaguePlayerResponse:
      type: object
      additionalProperties: false
      required: [registration]
      properties:
        registration:
          type: object
          additionalProperties: false
          required: [playerId, alreadyInGame]
          properties:
            playerId: { $ref: "#/components/schemas/DirectoryIdentifier" }
            alreadyInGame: { type: boolean }
    LeaguePlayerInvitationResponse:
      type: object
      required: [invitation]
      properties:
        invitation:
          oneOf:
            - { $ref: "#/components/schemas/PlayerInvitationMetadata" }
            - { type: "null" }
    CreatedLeaguePlayerInvitationResponse:
      type: object
      required: [invitation]
      properties:
        invitation: { $ref: "#/components/schemas/PlayerProofMetadata" }
    RevokeLeaguePlayerInvitationRequest:
      type: object
      additionalProperties: false
      required: [proofId]
      properties:
        proofId: { type: string, pattern: "^[a-zA-Z0-9_-]{20,64}$" }
    RevokeLeaguePlayerInvitationResponse:
      type: object
      required: [revoked]
      properties:
        revoked: { type: boolean, const: true }
    CreateLeagueRequest:
      type: object
      additionalProperties: false
      required:
        - leagueId
        - name
      properties:
        leagueId:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        slug:
          type:
            - string
            - "null"
    CreateSeasonRequest:
      type: object
      additionalProperties: false
      required:
        - seasonId
        - name
      properties:
        seasonId:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        slug:
          type:
            - string
            - "null"
        startsOn:
          type:
            - string
            - "null"
        endsOn:
          type:
            - string
            - "null"
    CreateSessionRequest:
      type: object
      additionalProperties: false
      required:
        - sessionId
        - sessionDate
      properties:
        sessionId:
          type: string
          minLength: 1
        sessionDate:
          type: string
          minLength: 1
    CreateGameRequest:
      type: object
      additionalProperties: false
      required:
        - gameId
        - gameStartTs
      properties:
        gameId:
          type: string
          minLength: 1
        gameStartTs:
          type: string
          minLength: 1
        status:
          type: string
          enum:
            - scheduled
            - live
        thirdLengthMinutes:
          type: integer
          enum:
            - 20
            - 25
            - 30
          default: 20
    UpsertTeamRequest:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
        color:
          type:
            - string
            - "null"
    QuickCreateGamePlayerRequest:
      type: object
      additionalProperties: false
      required:
        - nickname
      properties:
        playerId:
          type: string
          minLength: 1
        nickname:
          type: string
          minLength: 1
    JoinGameRequest:
      type: object
      additionalProperties: false
      required:
        - nickname
      properties:
        nickname:
          type: string
          minLength: 1
          maxLength: 80
        claimProof:
          $ref: "#/components/schemas/PlayerProofCreation"
    ClaimPlayerRequest:
      type: object
      additionalProperties: false
      properties:
        proof:
          type: object
          additionalProperties: false
          required: [proofId, secret, confirmation]
          properties:
            proofId: { type: string, pattern: "^[A-Za-z0-9_-]{20,64}$" }
            secret: { type: string, pattern: "^[A-Za-z0-9_-]{43}$" }
            confirmation: { type: string, maxLength: 100 }
    PlayerProofCreation:
      type: object
      additionalProperties: false
      required: [proofId, verifier]
      properties:
        proofId: { type: string, pattern: "^[A-Za-z0-9_-]{20,64}$" }
        verifier: { type: string, pattern: "^[a-f0-9]{64}$" }
    PlayerProofCredential:
      type: object
      additionalProperties: false
      required: [proofId, secret]
      properties:
