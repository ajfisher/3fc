openapi: 3.1.0
info:
  title: 3FC Core API
  version: 0.1.0
  description: |
    Core routes for public join-code registration plus authenticated league/season/session/game creation,
    organiser invites, M2 roster setup, third timer control, goal scoring reads and writes, and game finish.
servers:
  - url: https://qa-api.3fc.football
    description: QA
  - url: https://api.3fc.football
    description: Production
paths:
  /v1/join/{joinCode}/linked-players:
    get:
      operationId: listOwnedJoinPlayers
      summary: List the signed-in player's linked identities in this game's league
      description: >-
        Private session-authenticated read; not a public player or account directory. The server derives the
        account and legacy ownership aliases from the session. Follow every opaque cursor, including empty
        filtered pages, before treating the list as complete. Canonical identities can repeat across pages;
        deduplicate by playerId. A changed ownership, directory or game snapshot rejects continuation rather
        than certifying a partial list. No nickname matching or cross-league import. All responses use
        Cache-Control no-store and Referrer-Policy no-referrer. Returning-player joining is disabled by
        default and returns 503 until its reviewed writer deployment and drain are complete.
      parameters:
        - $ref: '#/components/parameters/OwnedJoinCode'
        - name: cursor
          in: query
          schema: { type: string, minLength: 1, maxLength: 8000 }
          description: Opaque cursor from this account and join scope; duplicate and unknown query fields are rejected.
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 20, default: 20 }
      responses:
        '200':
          description: One private page; complete is true exactly when cursor is null
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
            Referrer-Policy: { schema: { type: string, const: no-referrer } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OwnedJoinPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/OwnedJoinUnavailable' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /v1/join/{joinCode}/linked-player:
    post:
      operationId: joinOwnedPlayer
      summary: Join a game using an identity linked to the current account
      description: >-
        Requires an authenticated session, exact expectedAccountId and a stable Idempotency-Key. The
        account identifier must equal the current session subject (or email only when no subject exists);
        a switched account returns 403 account_changed before repository access. The server rechecks
        ownership and league scope. New registrations are Unassigned; existing registrations retain their
        original player ID and team. Joining finished games remains supported, without changing teams,
        goals or results. A committed receipt is replayed without duplicating registration; reuse with a
        different selected identity is rejected. Retain the exact body and key after an uncertain response.
        Deleted or invalid game context is never recreated by retry. All responses use Cache-Control
        no-store and Referrer-Policy no-referrer. The default-disabled returning-player gate returns 503.
      parameters:
        - $ref: '#/components/parameters/OwnedJoinCode'
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
          description: Stable non-empty request key retained with the exact selected identity for retries.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [playerId, expectedAccountId]
              properties:
                playerId: { $ref: '#/components/schemas/DirectoryIdentifier' }
                expectedAccountId: { type: string, minLength: 1, maxLength: 2048 }
      responses:
        '200':
          description: Registration outcome or original committed receipt; no claim secrets or ownership aliases
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
            Referrer-Policy: { schema: { type: string, const: no-referrer } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OwnedJoinResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/OwnedJoinUnavailable' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /v1/player-consolidations:
    post:
      operationId: previewPlayerConsolidation
      summary: Review an exact proposed combination of league player profiles
      description: >-
        League organisers only. Requires enabled consolidation and verified complete membership coverage.
        The client retains proposalId and the exact body for uncertain retries. Preview never combines profiles.
        Different owners, overlapping games (including Unassigned), outside-league membership, incomplete data
        and groups larger than 20 are rejected without exposing another league. No automatic nickname matching.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsolidationPreviewRequest'
      responses:
        '200':
          $ref: '#/components/responses/ConsolidationProposal'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/PlayerDirectoryUnavailable'
    get:
      operationId: getPlayerConsolidation
      summary: Read a private combination proposal as its organiser or affected owner
      description: The proposal ID grants no access. Responses are no-store and no-referrer and omit account identifiers.
      parameters:
        - name: proposalId
          in: query
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z0-9_-]{20,64}$'
      responses:
        '200':
          $ref: '#/components/responses/ConsolidationProposal'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/PlayerDirectoryUnavailable'
  /v1/player-consolidations/approve:
    post:
      operationId: decidePlayerConsolidation
      summary: Approve or decline the exact additions to your claimed identity
      description: >-
        Only the existing owner can approve; organiser permissions do not confer ownership.
        Approval binds the immutable proposal and does not commit the combination.
        Changed ownership, membership or identity invalidates the proposal.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [proposalId, decision, expectedAccountId]
              properties:
                expectedAccountId:
                  type: string
                  minLength: 1
                  maxLength: 2048
                proposalId:
                  type: string
                  pattern: '^[A-Za-z0-9_-]{20,64}$'
                decision:
                  type: string
                  enum: [approve, decline]
      responses:
        '200':
          $ref: '#/components/responses/ConsolidationProposal'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/PlayerDirectoryUnavailable'
  /v1/player-consolidations/commit:
    post:
      operationId: commitPlayerConsolidation
      summary: Atomically combine the approved profiles without rewriting historical events
      description: >-
        The initiating organiser must still have authority. The exact proposal, owner approval where required,
        complete alias closure and identity revisions are checked again. Commit stores a durable audit and
        idempotent outcome. Historical registrations, roster entries, goals, assists and corrections keep original IDs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [proposalId, expectedAccountId]
              properties:
                expectedAccountId:
                  type: string
                  minLength: 1
                  maxLength: 2048
                proposalId:
                  type: string
                  pattern: '^[A-Za-z0-9_-]{20,64}$'
      responses:
        '200':
          $ref: '#/components/responses/ConsolidationProposal'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/PlayerDirectoryUnavailable'
  /v1/league-players:
    get:
      summary: Search reusable players in an authorised league
      operationId: listLeaguePlayers
      description: >-
        Requires league organiser or scorer access. Includes claimed and unclaimed players; no account IDs or emails. Optional season scope never imports another league. Pages may be empty with a non-null cursor; continue until cursor is null. Cursors bind league, season, query and directory revision; a changed list returns 409. Verified season names are historical association, not current game counts. Responses are no-store and no-referrer. Available only after reviewed identity cutover.
      parameters:
        - $ref: "#/components/parameters/DirectoryLeagueId"
        - $ref: "#/components/parameters/DirectorySeasonId"
        - $ref: "#/components/parameters/DirectoryGameContext"
        - $ref: "#/components/parameters/DirectorySearch"
        - $ref: "#/components/parameters/DirectoryCursor"
        - $ref: "#/components/parameters/DirectoryLimit"
      responses:
        "200":
          description: Search reusable players in an authorised league
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaguePlayerPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/PlayerDirectoryUnavailable"
    post:
      summary: Create an unclaimed league player without game registration
      operationId: createLeaguePlayer
      description: >-
        League organisers only. The caller generates playerId and retains it through uncertain retries; the same account and exact request replay the original creation receipt. An existing global player ID cannot be imported. No claim proof is issued. Metadata, identity and directory association commit atomically. Unknown body or query fields are rejected. Responses are no-store and no-referrer.
      parameters:
        - $ref: "#/components/parameters/DirectoryLeagueId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLeaguePlayerRequest"
      responses:
        "201":
          description: Create an unclaimed league player without game registration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateLeaguePlayerResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/PlayerDirectoryUnavailable"
  /v1/game-player-registrations:
    post:
      summary: Register an existing league player in a game
      operationId: addExistingLeaguePlayer
      description: >-
        Requires league organiser or scorer access. Defaults to Unassigned; optional teamId assigns in the same transaction. Existing registration returns its original ID and assignment, without duplication or transfer. Finished games require allowFinished true and organiser access. Canonical identities are used for future games; existing historical registration IDs remain unchanged. Unknown fields are rejected. Responses are no-store and no-referrer.
      parameters:
        - $ref: "#/components/parameters/DirectoryGameId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddExistingLeaguePlayerRequest"
      responses:
        "200":
          description: Register an existing league player in a game
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddExistingLeaguePlayerResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/PlayerDirectoryUnavailable"
  /v1/player-proofs/league-invitation:
    get:
      summary: Read private profile invitation metadata for a league player
      operationId: getLeaguePlayerInvitation
      description: >-
        Requires league organiser authority and active canonical directory membership. A game registration is not required. Returns metadata only, never the secret or verifier. Foreign-league invitation metadata is not exposed. Responses are no-store and no-referrer.
      parameters:
        - $ref: "#/components/parameters/DirectoryLeagueId"
        - $ref: "#/components/parameters/DirectoryPlayerId"
      responses:
        "200":
          description: Read private profile invitation metadata for a league player
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaguePlayerInvitationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/PlayerDirectoryUnavailable"
    post:
      summary: Create or replace a private league player profile invitation
      operationId: createLeaguePlayerInvitation
      description: >-
        Requires league organiser authority. Uses the existing seven-day proof lifecycle, root revision and expected previous proof ID. Receives only a verifier; the browser retains the secret in the private fragment link. Opening and signing in do not consume it; the recipient explicitly confirms linking through the shared preview/claim endpoints. Does not change league permissions. Responses are no-store and no-referrer.
      parameters:
        - $ref: "#/components/parameters/DirectoryLeagueId"
        - $ref: "#/components/parameters/DirectoryPlayerId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePlayerInvitationRequest"
      responses:
        "201":
          description: Create or replace a private league player profile invitation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedLeaguePlayerInvitationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/PlayerDirectoryUnavailable"
  /v1/player-proofs/league-invitation/revoke:
    post:
      summary: Revoke the expected private league profile invitation
      operationId: revokeLeaguePlayerInvitation
      description: >-
        Requires league organiser authority. Only the specified current proof may be revoked. A stale replacement returns conflict; no bearer secret is required or returned. Responses are no-store and no-referrer.
      parameters:
        - $ref: "#/components/parameters/DirectoryLeagueId"
        - $ref: "#/components/parameters/DirectoryPlayerId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevokeLeaguePlayerInvitationRequest"
      responses:
        "200":
          description: Revoke the expected private league profile invitation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevokeLeaguePlayerInvitationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/PlayerDirectoryUnavailable"
  /v1/auth/logout:
    post:
      summary: Sign out the session represented by the current cookie
      operationId: logoutCurrentSession
      description: >-
        Deletes only the active session and expires its host-only HttpOnly cookie.
        No body or idempotency key is needed. Missing, invalid, expired and repeated
        sessions safely return 204. An allowed supplied Origin is required for browser
        mutations under the existing origin policy. Consumed magic links cannot recreate
        a deleted session. Independently issued sessions remain valid; copies of the same
        session are all revoked. Requests authorized before deletion may finish.
      responses:
        "204":
          description: Session revoked or already absent; response has no body
          headers:
            Set-Cookie:
              description: Empty session cookie with Path=/, HttpOnly, SameSite=Lax, past Expires, Max-Age=0 and environment-appropriate Secure; no Domain
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
                const: no-store
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          description: Revocation could not be confirmed; preserve cookie for safe retry
          content:
            application/json:
              schema:
                type: object
                required: [error, message]
                additionalProperties: false
                properties:
                  error:
                    type: string
                    const: logout_unavailable
                  message:
                    type: string
                    const: Sign out could not be confirmed. Please try again.
  /v1/join:
    post:
      summary: Reject join registration without a join code
      operationId: rejectMissingJoinCode
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
  /v1/join/{joinCode}:
    post:
      summary: Register a nickname player into a game by join code
      operationId: joinGameByCode
      description: Anonymous nickname registration remains available. When claimProof is supplied, a valid Idempotency-Key is required and proof metadata is committed with the exact new registration. During claim containment, registration still returns 201 with linkingUnavailable true and no proof; retries preserve that outcome. The request contains only a verifier, never the bearer secret. Protected organiser player creation cannot issue registration proof.
      parameters:
        - name: joinCode
          in: path
          required: true
          schema:
            type: string
            minLength: 8
            maxLength: 8
            pattern: "^[ABCDEFGHJKLMNPQRSTUVWXYZabcdefghjklmnpqrstuvwxyz23456789]{8}$"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinGameRequest"
      responses:
        "201":
          description: Player registered for the game
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinGameResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/JoinGameConflict"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /v1/join/{joinCode}/player-context:
    get:
      summary: Identify a joined player for an authenticated claim screen
      description: Requires a valid session and the exact player link in the game identified by the join code. Supply the opaque playerId as the sole URL-encoded query parameter, decoded exactly once. Missing, duplicate, unknown or malformed query parameters return 400 after authentication. Returns public identity only; does not claim a player or grant access. All responses use Cache-Control no-store.
      operationId: getJoinPlayerContext
      parameters:
        - name: joinCode
          in: path
          required: true
          schema:
            type: string
            minLength: 8
            maxLength: 8
            pattern: "^[ABCDEFGHJKLMNPQRSTUVWXYZabcdefghjklmnpqrstuvwxyz23456789]{8}$"
        - name: playerId
          in: query
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Public identity for the exact joined player
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinPlayerContextResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: Player details temporarily unavailable; retry the read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/leagues:
    post:
      summary: Create league
      operationId: createLeague
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLeagueRequest"
      responses:
        "201":
          description: League created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/League"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
  /v1/leagues/{leagueId}:
    delete:
      summary: Remove an empty league and finish resumable private-record cleanup
      operationId: deleteLeague
      parameters:
        - name: leagueId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                expectedAccountId:
                  type: string
                  description: Optional stable account binding, checked against the authenticated request. Prevents a pending browser action running under a different account.
      responses:
        "204":
          description: Removal and private-record cleanup confirmed, including same-initiator retries
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: League still contains seasons; nothing removed
        "503":
          description: Cleanup is pending or needs repair; retain the exact target and retry as the initiating account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/leagues/{leagueId}/access:
    post:
      summary: Grant league scoring or co-organiser access
      operationId: grantLeagueAccess
      parameters:
        - name: leagueId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GrantLeagueAccessRequest"
      responses:
        "200":
          description: League access granted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeagueAccessGrant"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/leagues/{leagueId}/organiser-invites:
    post:
      summary: Create or ensure a league organiser invite
      description: >-
        With no email, ensures and returns the league's reusable share invite.
        With an email, creates a one-time, email-restricted invite and starts
        direct magic-link delivery.
      operationId: createLeagueOrganiserInvite
      parameters:
        - name: leagueId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLeagueOrganiserInviteRequest"
      responses:
        "201":
          description: Organiser invite created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateLeagueOrganiserInviteResponse"
        "202":
          description: Organiser invite created, but direct email delivery could not be confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateLeagueOrganiserInviteResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/invites/{inviteCode}/accept:
    post:
      summary: Accept a league organiser invite
      description: >-
        Grants league admin access. Reusable share invites remain active after
        acceptance; one-time email invites are consumed on first acceptance and
        require the signed-in email to match the invite email.
      operationId: acceptLeagueOrganiserInvite
      parameters:
        - name: inviteCode
          in: path
          required: true
