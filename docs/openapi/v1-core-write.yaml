openapi: 3.1.0
info:
  title: 3FC Core API
  version: 0.1.0
  description: |
    Core routes for public join-code registration plus authenticated league/season/session/game creation,
    organiser invites, M2 roster setup, third timer control, goal scoring reads and writes, and game finish.
servers:
  - url: https://qa-api.3fc.football
    description: QA
  - url: https://api.3fc.football
    description: Production
paths:
  /v1/auth/logout:
    post:
      summary: Sign out the session represented by the current cookie
      operationId: logoutCurrentSession
      description: >-
        Deletes only the active session and expires its host-only HttpOnly cookie.
        No body or idempotency key is needed. Missing, invalid, expired and repeated
        sessions safely return 204. An allowed supplied Origin is required for browser
        mutations under the existing origin policy. Consumed magic links cannot recreate
        a deleted session. Independently issued sessions remain valid; copies of the same
        session are all revoked. Requests authorized before deletion may finish.
      responses:
        "204":
          description: Session revoked or already absent; response has no body
          headers:
            Set-Cookie:
              description: Empty session cookie with Path=/, HttpOnly, SameSite=Lax, past Expires, Max-Age=0 and environment-appropriate Secure; no Domain
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
                const: no-store
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          description: Revocation could not be confirmed; preserve cookie for safe retry
          content:
            application/json:
              schema:
                type: object
                required: [error, message]
                additionalProperties: false
                properties:
                  error:
                    type: string
                    const: logout_unavailable
                  message:
                    type: string
                    const: Sign out could not be confirmed. Please try again.
  /v1/join:
    post:
      summary: Reject join registration without a join code
      operationId: rejectMissingJoinCode
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
  /v1/join/{joinCode}:
    post:
      summary: Register a nickname player into a game by join code
      operationId: joinGameByCode
      description: Anonymous nickname registration remains available. When claimProof is supplied, a valid Idempotency-Key is required and proof metadata is committed with the exact new registration. During claim containment, registration still returns 201 with linkingUnavailable true and no proof; retries preserve that outcome. The request contains only a verifier, never the bearer secret. Protected organiser player creation cannot issue registration proof.
      parameters:
        - name: joinCode
          in: path
          required: true
          schema:
            type: string
            minLength: 8
            maxLength: 8
            pattern: "^[ABCDEFGHJKLMNPQRSTUVWXYZabcdefghjklmnpqrstuvwxyz23456789]{8}$"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinGameRequest"
      responses:
        "201":
          description: Player registered for the game
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinGameResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/JoinGameConflict"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /v1/join/{joinCode}/player-context:
    get:
      summary: Identify a joined player for an authenticated claim screen
      description: Requires a valid session and the exact player link in the game identified by the join code. Supply the opaque playerId as the sole URL-encoded query parameter, decoded exactly once. Missing, duplicate, unknown or malformed query parameters return 400 after authentication. Returns public identity only; does not claim a player or grant access. All responses use Cache-Control no-store.
      operationId: getJoinPlayerContext
      parameters:
        - name: joinCode
          in: path
          required: true
          schema:
            type: string
            minLength: 8
            maxLength: 8
            pattern: "^[ABCDEFGHJKLMNPQRSTUVWXYZabcdefghjklmnpqrstuvwxyz23456789]{8}$"
        - name: playerId
          in: query
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Public identity for the exact joined player
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinPlayerContextResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: Player details temporarily unavailable; retry the read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/leagues:
    post:
      summary: Create league
      operationId: createLeague
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLeagueRequest"
      responses:
        "201":
          description: League created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/League"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
  /v1/leagues/{leagueId}/access:
    post:
      summary: Grant league scoring or co-organiser access
      operationId: grantLeagueAccess
      parameters:
        - name: leagueId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GrantLeagueAccessRequest"
      responses:
        "200":
          description: League access granted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeagueAccessGrant"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/leagues/{leagueId}/organiser-invites:
    post:
      summary: Create or ensure a league organiser invite
      description: >-
        With no email, ensures and returns the league's reusable share invite.
        With an email, creates a one-time, email-restricted invite and starts
        direct magic-link delivery.
      operationId: createLeagueOrganiserInvite
      parameters:
        - name: leagueId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLeagueOrganiserInviteRequest"
      responses:
        "201":
          description: Organiser invite created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateLeagueOrganiserInviteResponse"
        "202":
          description: Organiser invite created, but direct email delivery could not be confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateLeagueOrganiserInviteResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/invites/{inviteCode}/accept:
    post:
      summary: Accept a league organiser invite
      description: >-
        Grants league admin access. Reusable share invites remain active after
        acceptance; one-time email invites are consumed on first acceptance and
        require the signed-in email to match the invite email.
      operationId: acceptLeagueOrganiserInvite
      parameters:
        - name: inviteCode
          in: path
          required: true
          schema:
            type: string
            minLength: 8
            maxLength: 8
            pattern: "^[ABCDEFGHJKLMNPQRSTUVWXYZabcdefghjklmnpqrstuvwxyz23456789]{8}$"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptLeagueOrganiserInviteRequest"
      responses:
        "200":
          description: Organiser invite accepted and league admin access granted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptLeagueOrganiserInviteResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/leagues/{leagueId}/seasons:
    post:
      summary: Create season
      operationId: createSeason
      parameters:
        - name: leagueId
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSeasonRequest"
      responses:
        "201":
          description: Season created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Season"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
  /v1/leagues/{leagueId}/seasons/{seasonId}:
    get:
      summary: Get a league-scoped season
      description: >-
        Resolves a season within its league so reused season slugs or IDs in
        another league cannot select the wrong season.
      operationId: getLeagueSeason
      parameters:
        - name: leagueId
          in: path
          required: true
          schema:
            type: string
        - name: seasonId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Season found within the league
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Season"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      summary: Delete a league-scoped season
      description: >-
        Deletes the season only from the requested league. The season must have
        no remaining scoped sessions or games.
      operationId: deleteLeagueSeason
      parameters:
        - name: leagueId
          in: path
          required: true
          schema:
            type: string
        - name: seasonId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Season deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/leagues/{leagueId}/seasons/{seasonId}/sessions:
    post:
      summary: Create a session for a league-scoped season
      description: >-
        Creates the session after resolving the season within the requested
        league, avoiding global season ID ambiguity.
      operationId: createLeagueSeasonSession
      parameters:
        - name: leagueId
          in: path
          required: true
          schema:
            type: string
        - name: seasonId
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
      responses:
        "201":
          description: Session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
  /v1/leagues/{leagueId}/seasons/{seasonId}/games:
    get:
      summary: List games for a league-scoped season
      description: >-
        Lists games only when both the session index and loaded game metadata
        belong to the requested league and season.
      operationId: listLeagueSeasonGames
      parameters:
        - name: leagueId
          in: path
          required: true
          schema:
            type: string
        - name: seasonId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: League-scoped season games
          content:
            application/json:
              schema:
                type: object
                required:
                  - games
                properties:
                  games:
                    type: array
                    items:
                      $ref: "#/components/schemas/Game"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/leagues/{leagueId}/seasons/{seasonId}/sessions/{sessionId}/games:
    post:
      summary: Create a game for a league-scoped season session
      description: >-
        Creates a game with explicit league, season, and session scope so reused
        season IDs cannot attach the game to another league.
      operationId: createLeagueSeasonSessionGame
      parameters:
        - name: leagueId
          in: path
          required: true
          schema:
            type: string
        - name: seasonId
          in: path
          required: true
          schema:
            type: string
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGameRequest"
      responses:
        "201":
          description: Game created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/CreateGameConflict"
  /v1/seasons/{seasonId}/sessions:
    post:
      summary: Create session
      operationId: createSession
      parameters:
        - name: seasonId
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
      responses:
        "201":
          description: Session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
  /v1/sessions/{sessionId}/games:
    post:
      summary: Create game
      operationId: createGame
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGameRequest"
      responses:
        "201":
          description: Game created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/CreateGameConflict"
  /v1/games/{gameId}/thirds/{third}/start:
    post:
      summary: Start a game third timer
      operationId: startGameThird
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/ThirdNumber"
      responses:
        "200":
          description: Third started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/games/{gameId}/thirds/{third}/finish:
    post:
      summary: Finish a game third timer
      operationId: finishGameThird
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/ThirdNumber"
      responses:
        "200":
          description: Third finished
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/games/{gameId}/finish:
    post:
      summary: Finish a game and compute final result
      operationId: finishGame
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Game finished with deterministic winner or draw result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/games/{gameId}/goals:
    get:
      summary: List game goal timeline and scoreboard
      operationId: listGameGoals
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Current scoreboard and goal timeline for the game
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameGoalsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      summary: Create a goal event and update game scoring tallies
      operationId: createGoal
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGoalRequest"
      responses:
        "201":
          description: Goal created with updated scoreboard and timeline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateGoalResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: State conflict, including no running third, idempotency conflict, duplicate goal request, or stale scoreboard state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/games/{gameId}/goals/undo-last:
    post:
      summary: Delete the current most recent goal event
      operationId: undoLastGoal
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UndoLastGoalRequest"
      responses:
        "200":
          description: Latest goal deleted with updated scoreboard, timeline, and audit entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteGoalResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/games/{gameId}/goals/{eventId}:
    patch:
      summary: Correct an existing goal event without changing its timer stamp
      operationId: updateGoal
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: string
        - name: eventId
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateGoalRequest"
      responses:
        "200":
          description: Goal updated with recalculated scoreboard, timeline, and audit entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateGoalResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      summary: Delete a goal event and recompute game scoring tallies
      operationId: deleteGoal
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: string
        - name: eventId
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Goal deleted with recalculated scoreboard, timeline, and audit entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteGoalResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/seasons/{seasonId}/teams:
    get:
      summary: List season default teams
      operationId: listSeasonTeams
      parameters:
        - name: seasonId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Season teams
          content:
            application/json:
              schema:
                type: object
                required:
                  - teams
                properties:
                  teams:
                    type: array
                    items:
                      $ref: "#/components/schemas/SeasonTeam"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/seasons/{seasonId}/teams/{teamId}:
    put:
      summary: Upsert season default team
      operationId: upsertSeasonTeam
      parameters:
        - name: seasonId
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/TeamId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertTeamRequest"
      responses:
        "200":
          description: Season team upserted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeasonTeam"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/games/{gameId}/teams:
    get:
      summary: List game teams
      operationId: listGameTeams
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Game teams
          content:
            application/json:
              schema:
                type: object
                required:
                  - teams
                properties:
                  teams:
                    type: array
                    items:
                      $ref: "#/components/schemas/GameTeam"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/games/{gameId}/teams/{teamId}:
    put:
      summary: Upsert game team override
      operationId: upsertGameTeam
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/TeamId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertTeamRequest"
      responses:
        "200":
          description: Game team upserted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameTeam"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/players/{playerId}/claim:
    post:
      summary: Explicitly link a proof-authorised player to the signed-in account
      description: Every first claim requires a valid private proof and short-lived confirmation returned by preview for this exact server-resolved session/account. A proofless request only preserves an existing same-owner retry. Consumed proofs return their immutable same-owner receipt after binding validation, without granting access or recreating deleted records. Responses are no-store and no-referrer.
      operationId: claimPlayer
      parameters:
        - name: playerId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimPlayerRequest"
      responses:
        "200":
          description: Player claimed for the current signed-in user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimPlayerResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/PlayerLinkingUnavailable"
  /v1/player-proofs/preview:
    post:
      summary: Preview a private player link without consuming it
      operationId: previewPlayerProof
      description: Requires a session. Returns the exact player, league and signed-in account together with an opaque session-bound confirmation. Never grants ownership. Responses are no-store and no-referrer; secrets and confirmations must never be logged.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlayerProofCredential"
      responses:
        "200":
          description: Account-bound preview, including same-owner consumed receipt recovery
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerProofPreviewResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/PlayerLinkingUnavailable"
  /v1/games/{gameId}/players/{playerId}/profile-invitation:
    parameters:
      - name: gameId
        in: path
        required: true
        schema: { type: string, minLength: 1 }
      - name: playerId
        in: path
        required: true
        schema: { type: string, minLength: 1 }
    get:
      summary: Check the current private invitation for a registered player
      operationId: getPlayerInvitation
      description: League organisers only. Returns metadata, never a bearer secret. A TTL-deleted proof retains expired pointer metadata so the organiser can replace it safely.
      responses:
        "200":
          description: Current invitation metadata or null
          content:
            application/json:
              schema:
                type: object
                required: [invitation]
                properties:
                  invitation:
                    anyOf:
                      - $ref: "#/components/schemas/PlayerInvitationMetadata"
                      - type: "null"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      summary: Create or replace a private profile-link invitation
      operationId: createPlayerInvitation
      description: League organisers only. The client retains the random secret and submits its SHA-256 verifier. Creation is idempotent by proofId and exact inputs. Replacement must name the current predecessor proofId; a stale predecessor conflicts. Invites expire seven days after the persisted creation instant. No email is sent. All responses are no-store and no-referrer.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePlayerInvitationRequest"
      responses:
        "201":
          description: Persisted invitation metadata, also returned for an exact retry while the invitation remains pending, current and valid. Consumed, revoked, replaced or expired invitation retries return 409.
          content:
            application/json:
              schema:
                type: object
                required: [invitation]
                properties:
                  invitation:
                    $ref: "#/components/schemas/PlayerProofMetadata"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/PlayerLinkingUnavailable"
  /v1/games/{gameId}/players/{playerId}/profile-invitation/revoke:
    post:
      summary: Revoke a player's private invitation
      operationId: revokePlayerInvitation
      description: League organisers only. Idempotent; revocation does not remove existing ownership or a consumed receipt.
      parameters:
        - name: gameId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
        - name: playerId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [proofId]
              properties:
                proofId: { type: string, pattern: "^[A-Za-z0-9_-]{20,64}$" }
      responses:
        "200":
          description: Revocation confirmed, including an already revoked or consumed invitation
          content:
            application/json:
              schema:
                type: object
                required: [revoked]
                properties:
                  revoked: { type: boolean, const: true }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /v1/games/{gameId}/players:
    get:
      summary: List recent/searchable players for a game roster
      operationId: listGamePlayers
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: string
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Player list
          content:
            application/json:
              schema:
                type: object
                required:
                  - players
                properties:
                  players:
                    type: array
                    items:
                      $ref: "#/components/schemas/Player"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      summary: Quick-create a nickname player in game setup
      operationId: quickCreateGamePlayer
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuickCreateGamePlayerRequest"
      responses:
        "201":
          description: Player created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
  /v1/games/{gameId}/roster:
    get:
      summary: Read game roster
      operationId: listGameRoster
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Game roster with teams and player nicknames
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameRosterResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/games/{gameId}/roster/{playerId}:
    put:
      summary: Assign or reassign a player to a game team
      operationId: assignRosterPlayer
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: string
        - name: playerId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignRosterPlayerRequest"
      responses:
        "200":
          description: Roster assignment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RosterAssignment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 128
      description: Optional idempotency key for replay-safe writes.
    TeamId:
      name: teamId
      in: path
      required: true
      schema:
        type: string
        enum:
          - red
          - blue
          - yellow
    ThirdNumber:
      name: third
      in: path
      required: true
      schema:
        type: integer
        enum:
          - 1
          - 2
          - 3
  responses:
    InternalServerError:
      description: The request could not be completed because of an internal or storage failure
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PlayerLinkingUnavailable:
      description: New player linking is temporarily disabled (code claims_unavailable). This response does not commit a new claim or invitation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BadRequest:
      description: Request body or headers failed validation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Missing or invalid session
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Caller does not have required ACL permissions
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Referenced parent entity not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: State transition or idempotent write rejected
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RateLimited:
      description: Direct email invite delivery rate limit exceeded
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    CreateGameConflict:
      description: Idempotency key was reused with a different request payload, or the game/join code already exists
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    JoinGameConflict:
      description: Idempotency key was reused with a different request payload, or the join state changed while registering
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    IdempotencyConflict:
      description: Idempotency key was reused with a different request payload
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    CreateLeagueRequest:
      type: object
      additionalProperties: false
      required:
        - leagueId
        - name
      properties:
        leagueId:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        slug:
          type:
            - string
            - "null"
    CreateSeasonRequest:
      type: object
      additionalProperties: false
      required:
        - seasonId
        - name
      properties:
        seasonId:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        slug:
          type:
            - string
            - "null"
        startsOn:
          type:
            - string
            - "null"
        endsOn:
          type:
            - string
            - "null"
    CreateSessionRequest:
      type: object
      additionalProperties: false
      required:
        - sessionId
        - sessionDate
      properties:
        sessionId:
          type: string
          minLength: 1
        sessionDate:
          type: string
          minLength: 1
    CreateGameRequest:
      type: object
      additionalProperties: false
      required:
        - gameId
        - gameStartTs
      properties:
        gameId:
          type: string
          minLength: 1
        gameStartTs:
          type: string
          minLength: 1
        status:
          type: string
          enum:
            - scheduled
            - live
        thirdLengthMinutes:
          type: integer
          enum:
            - 20
            - 25
            - 30
          default: 20
    UpsertTeamRequest:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
        color:
          type:
            - string
            - "null"
    QuickCreateGamePlayerRequest:
      type: object
      additionalProperties: false
      required:
        - nickname
      properties:
        playerId:
          type: string
          minLength: 1
        nickname:
          type: string
          minLength: 1
    JoinGameRequest:
      type: object
      additionalProperties: false
      required:
        - nickname
      properties:
        nickname:
          type: string
          minLength: 1
          maxLength: 80
        claimProof:
          $ref: "#/components/schemas/PlayerProofCreation"
    ClaimPlayerRequest:
      type: object
      additionalProperties: false
      properties:
        proof:
          type: object
          additionalProperties: false
          required: [proofId, secret, confirmation]
          properties:
            proofId: { type: string, pattern: "^[A-Za-z0-9_-]{20,64}$" }
            secret: { type: string, pattern: "^[A-Za-z0-9_-]{43}$" }
            confirmation: { type: string, maxLength: 100 }
    PlayerProofCreation:
      type: object
      additionalProperties: false
      required: [proofId, verifier]
      properties:
        proofId: { type: string, pattern: "^[A-Za-z0-9_-]{20,64}$" }
        verifier: { type: string, pattern: "^[a-f0-9]{64}$" }
    PlayerProofCredential:
      type: object
      additionalProperties: false
      required: [proofId, secret]
      properties:
        proofId: { type: string, pattern: "^[A-Za-z0-9_-]{20,64}$" }
        secret: { type: string, pattern: "^[A-Za-z0-9_-]{43}$" }
    CreatePlayerInvitationRequest:
      type: object
      additionalProperties: false
      required: [proofId, verifier]
      properties:
        proofId: { type: string, pattern: "^[A-Za-z0-9_-]{20,64}$" }
        verifier: { type: string, pattern: "^[a-f0-9]{64}$" }
        replacesProofId:
          type: [string, "null"]
          pattern: "^[A-Za-z0-9_-]{20,64}$"
    PlayerProofMetadata:
      type: object
      required: [proofId, expiresAt]
      properties:
        proofId: { type: string }
        expiresAt: { type: string, format: date-time }
    PlayerInvitationMetadata:
      allOf:
        - $ref: "#/components/schemas/PlayerProofMetadata"
        - type: object
          required: [state]
          properties:
            state: { type: string, enum: [pending, revoked, consumed, expired] }
    PlayerProofPreviewResponse:
      type: object
      required: [preview, account]
      properties:
        account:
          type: object
          required: [id, email]
          properties:
            id:
              type: string
              minLength: 1
              maxLength: 1024
              description: Current authenticated account identity, used only to detect a changed account in retained browser proof state. Not an ownership proof or permission grant; never render it in the player card.
            email: { type: string }
        preview:
          allOf:
            - $ref: "#/components/schemas/PlayerProofMetadata"
            - type: object
              required: [player, league, alreadyLinked, confirmation]
              properties:
                player:
                  type: object
                  required: [playerId, nickname]
                  properties:
                    playerId: { type: string }
                    nickname: { type: string }
                league:
                  type: object
                  required: [leagueId, name]
                  properties:
                    leagueId: { type: string }
                    name: { type: string }
                alreadyLinked: { type: boolean }
                confirmation: { type: string }
    GrantLeagueAccessRequest:
      type: object
      additionalProperties: false
      required:
        - userId
        - role
      properties:
        userId:
          type: string
          minLength: 1
        role:
          type: string
          enum:
            - admin
            - scorekeeper
    CreateLeagueOrganiserInviteRequest:
      type: object
      additionalProperties: false
      properties:
        email:
          type:
            - string
            - "null"
          format: email
          description: >-
            Optional email restriction. When omitted or null, the API ensures the
            reusable league share invite. When present, the API creates a
            one-time email invite and sends a magic-link invite to this email.
    AcceptLeagueOrganiserInviteRequest:
      type: object
      additionalProperties: false
    AssignRosterPlayerRequest:
      type: object
      additionalProperties: false
      required:
        - teamId
      properties:
        teamId:
          type: string
          enum:
            - red
            - blue
            - yellow
    CreateGoalRequest:
      type: object
      additionalProperties: false
      required:
        - scoringTeamId
        - concedingTeamId
        - scorerPlayerId
        - ownGoal
      properties:
        scoringTeamId:
          type:
            - string
            - "null"
          enum:
            - red
            - blue
            - yellow
            - null
        concedingTeamId:
          type: string
          enum:
            - red
            - blue
            - yellow
        scorerPlayerId:
          type: string
          minLength: 1
        assistPlayerIds:
          type: array
          default: []
          maxItems: 3
          uniqueItems: true
          items:
            type: string
            minLength: 1
        ownGoal:
          type: boolean
    UpdateGoalRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        scoringTeamId:
          type:
            - string
            - "null"
          enum:
            - red
            - blue
            - yellow
            - null
        concedingTeamId:
          type: string
          enum:
            - red
            - blue
            - yellow
        scorerPlayerId:
          type: string
          minLength: 1
        assistPlayerIds:
          type: array
          maxItems: 3
          items:
            type: string
            minLength: 1
          uniqueItems: true
        ownGoal:
          type: boolean
    UndoLastGoalRequest:
      type: object
      additionalProperties: false
      required:
        - expectedEventId
      properties:
        expectedEventId:
          type: string
          minLength: 1
    League:
      type: object
      required:
        - leagueId
        - name
        - slug
        - createdByUserId
        - createdAt
        - updatedAt
      properties:
        leagueId:
          type: string
        name:
          type: string
        slug:
          type:
            - string
            - "null"
        createdByUserId:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        access:
          type: object
          additionalProperties: false
          properties:
            role:
              type: string
              enum:
                - admin
                - scorekeeper
                - viewer
    Season:
      type: object
      required:
        - leagueId
        - seasonId
        - name
        - slug
        - startsOn
        - endsOn
        - createdAt
        - updatedAt
      properties:
        leagueId:
          type: string
        seasonId:
          type: string
        name:
          type: string
        slug:
          type:
            - string
            - "null"
        startsOn:
          type:
            - string
            - "null"
        endsOn:
          type:
            - string
            - "null"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Session:
      type: object
      required:
        - seasonId
        - sessionId
        - sessionDate
        - createdAt
        - updatedAt
      properties:
        seasonId:
          type: string
        sessionId:
          type: string
        sessionDate:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Game:
      type: object
      required:
        - gameId
        - joinCode
        - leagueId
        - seasonId
        - sessionId
        - status
        - gameStartTs
        - thirdLengthMinutes
        - thirds
        - finishedAt
        - result
        - timer
        - createdAt
        - updatedAt
      properties:
        gameId:
          type: string
        joinCode:
          type: string
        leagueId:
          type: string
        seasonId:
          type: string
        sessionId:
          type: string
        status:
          type: string
          enum:
            - scheduled
            - live
            - finished
        gameStartTs:
          type: string
        thirdLengthMinutes:
          type: integer
          enum:
            - 20
            - 25
            - 30
        thirds:
          type: array
          minItems: 3
          maxItems: 3
          items:
            $ref: "#/components/schemas/ThirdTimerSegment"
        finishedAt:
          type:
            - string
            - "null"
          format: date-time
        result:
          oneOf:
            - $ref: "#/components/schemas/GameResult"
            - type: "null"
        timer:
          $ref: "#/components/schemas/GameTimerState"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    GameResult:
      type: object
      required:
        - winnerTeamId
        - outcome
        - comparator
        - computedAt
        - teams
      properties:
        winnerTeamId:
          type:
            - string
            - "null"
          enum:
            - red
            - blue
            - yellow
            - null
        outcome:
          type: string
          enum:
            - win
            - draw
        comparator:
          type: string
          enum:
            - fewest_conceded_then_most_scored
        computedAt:
          type: string
          format: date-time
        teams:
          type: array
          minItems: 3
          maxItems: 3
          items:
            $ref: "#/components/schemas/GameResultTeam"
    GameResultTeam:
      type: object
      required:
        - teamId
        - name
        - color
        - scored
        - conceded
        - rank
        - outcome
      properties:
        teamId:
          type: string
          enum:
            - red
            - blue
            - yellow
        name:
          type: string
        color:
          type:
            - string
            - "null"
        scored:
