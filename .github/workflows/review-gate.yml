name: Review gate

on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft
      - review_requested
      - closed
      - labeled
      - unlabeled
  pull_request_review:
    types:
      - submitted
      - edited
      - dismissed
  pull_request_review_comment:
    types:
      - created
      - edited
      - deleted
  issue_comment:
    types:
      - created
  workflow_run:
    workflows:
      - PR checks
      - Deploy QA
    types:
      - completed
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to refresh
        required: true
        type: number

permissions:
  contents: read
  pull-requests: read
  checks: write
  issues: write

concurrency:
  group: >-
    review-gate-${{
      github.event.pull_request.number ||
      github.event.issue.number ||
      github.event.workflow_run.id ||
      github.run_id
    }}
  cancel-in-progress: true

jobs:
  evaluate:
    name: evaluate-review-gate
    if: >-
      github.event_name != 'issue_comment' ||
      (
        github.event.issue.pull_request &&
        github.event.comment.body == '/review-gate refresh' &&
        (
          github.event.comment.author_association == 'OWNER' ||
          github.event.comment.author_association == 'MEMBER' ||
          github.event.comment.author_association == 'COLLABORATOR'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22

      - name: Evaluate current pull request state
        env:
          GITHUB_TOKEN: ${{ github.token }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
        run: node scripts/review-gate/run.mjs
