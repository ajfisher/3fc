name: Deploy Production

on:
  push:
    branches:
      - main
    paths:
      - app/**
      - api/**
      - packages/contracts/**
      - scripts/deploy/**
      - serverless.*.yml
      - package.json
      - package-lock.json
      - Makefile
      - .github/workflows/deploy-prod.yml

concurrency:
  group: deploy-prod-main
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

jobs:
  deploy:
    name: deploy-prod
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME_PROD }}
          role-session-name: gha-prod-deploy
          aws-region: ap-southeast-2

      - name: Deploy site to production
        run: make deploy ENV=prod SERVICE=site

      - name: Deploy API health service to production
        env:
          SERVERLESS_ACCESS_KEY: ${{ secrets.SERVERLESS_ACCESS_KEY }}
        run: make deploy ENV=prod SERVICE=api-health

      - name: Deploy API core service to production
        env:
          SERVERLESS_ACCESS_KEY: ${{ secrets.SERVERLESS_ACCESS_KEY }}
        run: make deploy ENV=prod SERVICE=api-core

      - name: Smoke test deployed production health endpoint
        run: |
          MANIFEST_PATH="out/deploy/prod/api-health-deploy-manifest.json"

          if [ ! -f "$MANIFEST_PATH" ]; then
            echo "Expected deploy manifest at $MANIFEST_PATH"
            exit 1
          fi

          API_ID="$(jq -r '.httpApiId // empty' "$MANIFEST_PATH")"
          if [ -z "$API_ID" ]; then
            echo "Deploy manifest did not include httpApiId."
            exit 1
          fi

          ENDPOINT="https://${API_ID}.execute-api.ap-southeast-2.amazonaws.com/v1/health"
          HTTP_CODE="$(curl -sS -o /tmp/prod-health.json -w '%{http_code}' "$ENDPOINT")"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "Smoke test failed for ${ENDPOINT} (HTTP ${HTTP_CODE})"
            cat /tmp/prod-health.json
            exit 1
          fi

          jq -e '.status == "ok"' /tmp/prod-health.json >/dev/null

          {
            echo "SMOKE_ENDPOINT=${ENDPOINT}"
            echo "SMOKE_HTTP_CODE=${HTTP_CODE}"
          } >> "$GITHUB_ENV"

      - name: Smoke test deployed production site routes
        run: |
          MANIFEST_PATH="out/deploy/prod/site-deploy-manifest.json"

          if [ ! -f "$MANIFEST_PATH" ]; then
            echo "Expected deploy manifest at $MANIFEST_PATH"
            exit 1
          fi

          SITE_URL="$(jq -r '.siteUrl // empty' "$MANIFEST_PATH")"
          if [ -z "$SITE_URL" ]; then
            echo "Deploy manifest did not include siteUrl."
            exit 1
          fi

          ROOT_HTTP_CODE="$(curl -sS -D /tmp/prod-site-root.headers -o /tmp/prod-site-root.html -w '%{http_code}' "${SITE_URL}/")"
          SIGNIN_HTTP_CODE="$(curl -sS -o /tmp/prod-site-signin.html -w '%{http_code}' "${SITE_URL}/sign-in")"
          SETUP_HTTP_CODE="$(curl -sS -o /tmp/prod-site-setup.html -w '%{http_code}' "${SITE_URL}/setup")"
          CALLBACK_HTTP_CODE="$(curl -sS -D /tmp/prod-site-callback.headers -o /tmp/prod-site-callback.html -w '%{http_code}' "${SITE_URL}/auth/callback")"
          CALLBACK_SLASH_HTTP_CODE="$(curl -sS -D /tmp/prod-site-callback-slash.headers -o /tmp/prod-site-callback-slash.html -w '%{http_code}' "${SITE_URL}/auth/callback/")"
          AUTH_FLOW_HTTP_CODE="$(curl -sS -o /tmp/prod-site-auth-flow.js -w '%{http_code}' "${SITE_URL}/ui/auth-flow.js")"
          JOIN_HTTP_CODE="$(curl -sS -o /tmp/prod-site-join.html -w '%{http_code}' "${SITE_URL}/join")"
          JOIN_LINK_HTTP_CODE="$(curl -sS -o /tmp/prod-site-join-link.html -w '%{http_code}' "${SITE_URL}/join?code=ABCDEFGH")"

          if [ "$ROOT_HTTP_CODE" != "200" ]; then
            echo "Smoke test failed for ${SITE_URL}/ (HTTP ${ROOT_HTTP_CODE})"
            cat /tmp/prod-site-root.html
            exit 1
          fi

          if [ "$SIGNIN_HTTP_CODE" != "200" ]; then
            echo "Smoke test failed for ${SITE_URL}/sign-in (HTTP ${SIGNIN_HTTP_CODE})"
            cat /tmp/prod-site-signin.html
            exit 1
          fi

          if [ "$SETUP_HTTP_CODE" != "200" ]; then
            echo "Smoke test failed for ${SITE_URL}/setup (HTTP ${SETUP_HTTP_CODE})"
            cat /tmp/prod-site-setup.html
            exit 1
          fi

          if [ "$CALLBACK_HTTP_CODE" != "200" ]; then
            echo "Smoke test failed for ${SITE_URL}/auth/callback (HTTP ${CALLBACK_HTTP_CODE})"
            cat /tmp/prod-site-callback.html
            exit 1
          fi

          if [ "$CALLBACK_SLASH_HTTP_CODE" != "200" ]; then
            echo "Smoke test failed for ${SITE_URL}/auth/callback/ (HTTP ${CALLBACK_SLASH_HTTP_CODE})"
            cat /tmp/prod-site-callback-slash.html
            exit 1
          fi

          if [ "$AUTH_FLOW_HTTP_CODE" != "200" ]; then
            echo "Smoke test failed for ${SITE_URL}/ui/auth-flow.js (HTTP ${AUTH_FLOW_HTTP_CODE})"
            exit 1
          fi

          if [ "$JOIN_HTTP_CODE" != "200" ]; then
            echo "Smoke test failed for ${SITE_URL}/join (HTTP ${JOIN_HTTP_CODE})"
            cat /tmp/prod-site-join.html
            exit 1
          fi

          if [ "$JOIN_LINK_HTTP_CODE" != "200" ]; then
            echo "Smoke test failed for ${SITE_URL}/join?code=ABCDEFGH (HTTP ${JOIN_LINK_HTTP_CODE})"
            cat /tmp/prod-site-join-link.html
            exit 1
          fi

          grep -q "Dashboard" /tmp/prod-site-root.html
          grep -qi '^referrer-policy: strict-origin-when-cross-origin' /tmp/prod-site-root.headers
          grep -q "Sign in before setup" /tmp/prod-site-signin.html
          grep -q "Dashboard" /tmp/prod-site-setup.html
          grep -q "Complete sign-in" /tmp/prod-site-callback.html
          grep -q "Complete sign-in" /tmp/prod-site-callback-slash.html
          grep -q "initAuthCallbackPage" /tmp/prod-site-auth-flow.js
          grep -qi "^content-security-policy: .*script-src 'self'.*connect-src 'self' https://api\.3fc\.football" /tmp/prod-site-callback.headers
          grep -qi '^referrer-policy: no-referrer' /tmp/prod-site-callback.headers
          grep -qi '^cache-control: no-cache, no-store, must-revalidate' /tmp/prod-site-callback.headers
          grep -qi "^content-security-policy: .*script-src 'self'.*connect-src 'self' https://api\.3fc\.football" /tmp/prod-site-callback-slash.headers
          grep -qi '^referrer-policy: no-referrer' /tmp/prod-site-callback-slash.headers
          grep -qi '^cache-control: no-cache, no-store, must-revalidate' /tmp/prod-site-callback-slash.headers
          grep -q "Join game" /tmp/prod-site-join.html
          grep -q "Join game" /tmp/prod-site-join-link.html

          {
            echo "SITE_URL=${SITE_URL}"
            echo "SITE_ROOT_HTTP_CODE=${ROOT_HTTP_CODE}"
            echo "SITE_SIGNIN_HTTP_CODE=${SIGNIN_HTTP_CODE}"
            echo "SITE_SETUP_HTTP_CODE=${SETUP_HTTP_CODE}"
            echo "SITE_CALLBACK_HTTP_CODE=${CALLBACK_HTTP_CODE}"
            echo "SITE_CALLBACK_SLASH_HTTP_CODE=${CALLBACK_SLASH_HTTP_CODE}"
            echo "SITE_AUTH_FLOW_HTTP_CODE=${AUTH_FLOW_HTTP_CODE}"
            echo "SITE_JOIN_HTTP_CODE=${JOIN_HTTP_CODE}"
            echo "SITE_JOIN_LINK_HTTP_CODE=${JOIN_LINK_HTTP_CODE}"
          } >> "$GITHUB_ENV"

      - name: Smoke test deployed production core endpoints
        run: |
          MANIFEST_PATH="out/deploy/prod/api-core-deploy-manifest.json"

          if [ ! -f "$MANIFEST_PATH" ]; then
            echo "Expected deploy manifest at $MANIFEST_PATH"
            exit 1
          fi

          API_ID="$(jq -r '.httpApiId // empty' "$MANIFEST_PATH")"
          if [ -z "$API_ID" ]; then
            echo "Deploy manifest did not include httpApiId."
            exit 1
          fi

          CORE_ENDPOINT="https://${API_ID}.execute-api.ap-southeast-2.amazonaws.com/v1/leagues"
          CORE_HTTP_CODE="$(curl -sS -o /tmp/prod-core.json -w '%{http_code}' \
            -X POST "$CORE_ENDPOINT" \
            -H 'content-type: application/json' \
            -d '{}')"

          if [ "$CORE_HTTP_CODE" != "401" ]; then
            echo "Smoke test failed for ${CORE_ENDPOINT} (HTTP ${CORE_HTTP_CODE})"
            cat /tmp/prod-core.json
            exit 1
          fi

          jq -e '.error == "unauthorized"' /tmp/prod-core.json >/dev/null

          CLAIM_ENDPOINT="https://${API_ID}.execute-api.ap-southeast-2.amazonaws.com/v1/players/smoke-player/claim"
          CLAIM_HTTP_CODE="$(curl -sS -o /tmp/prod-claim.json -w '%{http_code}' \
            -X POST "$CLAIM_ENDPOINT" \
            -H 'content-type: application/json' \
            -H 'origin: https://3fc.football' \
            -d '{}')"

          if [ "$CLAIM_HTTP_CODE" != "401" ]; then
            echo "Smoke test failed for ${CLAIM_ENDPOINT} (HTTP ${CLAIM_HTTP_CODE})"
            cat /tmp/prod-claim.json
            exit 1
          fi

          jq -e '.error == "unauthorized"' /tmp/prod-claim.json >/dev/null

          ACCESS_ENDPOINT="https://${API_ID}.execute-api.ap-southeast-2.amazonaws.com/v1/leagues/smoke-league/access"
          ACCESS_HTTP_CODE="$(curl -sS -o /tmp/prod-access.json -w '%{http_code}' \
            -X POST "$ACCESS_ENDPOINT" \
            -H 'content-type: application/json' \
            -H 'origin: https://3fc.football' \
            -d '{"userId":"scorekeeper@3fc.football","role":"scorekeeper"}')"

          if [ "$ACCESS_HTTP_CODE" != "401" ]; then
            echo "Smoke test failed for ${ACCESS_ENDPOINT} (HTTP ${ACCESS_HTTP_CODE})"
            cat /tmp/prod-access.json
            exit 1
          fi

          jq -e '.error == "unauthorized"' /tmp/prod-access.json >/dev/null

          MAGIC_ENDPOINT="https://${API_ID}.execute-api.ap-southeast-2.amazonaws.com/v1/auth/magic/start"
          MAGIC_HTTP_CODE="$(curl -sS -o /tmp/prod-magic.json -w '%{http_code}' \
            -X POST "$MAGIC_ENDPOINT" \
            -H 'content-type: application/json' \
            -H 'origin: https://3fc.football' \
            -d '{}')"

          if [ "$MAGIC_HTTP_CODE" != "400" ]; then
            echo "Smoke test failed for ${MAGIC_ENDPOINT} (HTTP ${MAGIC_HTTP_CODE})"
            cat /tmp/prod-magic.json
            exit 1
          fi

          {
            echo "SMOKE_CORE_ENDPOINT=${CORE_ENDPOINT}"
            echo "SMOKE_CORE_HTTP_CODE=${CORE_HTTP_CODE}"
            echo "SMOKE_CLAIM_ENDPOINT=${CLAIM_ENDPOINT}"
            echo "SMOKE_CLAIM_HTTP_CODE=${CLAIM_HTTP_CODE}"
            echo "SMOKE_ACCESS_ENDPOINT=${ACCESS_ENDPOINT}"
            echo "SMOKE_ACCESS_HTTP_CODE=${ACCESS_HTTP_CODE}"
            echo "SMOKE_MAGIC_ENDPOINT=${MAGIC_ENDPOINT}"
            echo "SMOKE_MAGIC_HTTP_CODE=${MAGIC_HTTP_CODE}"
          } >> "$GITHUB_ENV"

      - name: Write deployment summary
        run: |
          {
            echo "## Production deploy complete"
            echo "- Branch: main"
            echo "- Commit: ${{ github.sha }}"
            echo "- Services: site, api-health, api-core"
            echo "- Site URL: ${SITE_URL}"
            echo "- Site root status: HTTP ${SITE_ROOT_HTTP_CODE}"
            echo "- Site sign-in status: HTTP ${SITE_SIGNIN_HTTP_CODE}"
            echo "- Site setup status: HTTP ${SITE_SETUP_HTTP_CODE}"
            echo "- Site join status: HTTP ${SITE_JOIN_HTTP_CODE}"
            echo "- Site join link status: HTTP ${SITE_JOIN_LINK_HTTP_CODE}"
            echo "- Smoke endpoint: ${SMOKE_ENDPOINT}"
            echo "- Smoke status: HTTP ${SMOKE_HTTP_CODE}"
            echo "- Core smoke endpoint: ${SMOKE_CORE_ENDPOINT}"
            echo "- Core smoke status: HTTP ${SMOKE_CORE_HTTP_CODE}"
            echo "- Claim route smoke endpoint: ${SMOKE_CLAIM_ENDPOINT}"
            echo "- Claim route smoke status: HTTP ${SMOKE_CLAIM_HTTP_CODE}"
            echo "- Access route smoke endpoint: ${SMOKE_ACCESS_ENDPOINT}"
            echo "- Access route smoke status: HTTP ${SMOKE_ACCESS_HTTP_CODE}"
            echo "- Magic-link smoke endpoint: ${SMOKE_MAGIC_ENDPOINT}"
            echo "- Magic-link smoke status: HTTP ${SMOKE_MAGIC_HTTP_CODE}"
          } >> "$GITHUB_STEP_SUMMARY"
